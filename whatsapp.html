<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>BrickBloom — WhatsApp Bulk Sender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-950:#052e16; --green-900:#14532d; --green-800:#166534; --green-700:#15803d;
      --green-600:#16a34a; --green-100:#dcfce7; --green-50:#f0fdf4;
      --slate-950:#020617; --slate-900:#0f172a; --slate-700:#334155;
      --slate-600:#475569; --slate-500:#64748b; --slate-400:#94a3b8; --slate-300:#cbd5e1;
      --slate-200:#e2e8f0; --slate-100:#f1f5f9; --slate-50:#f8fafc;
      --red-600:#dc2626; --amber-500:#f59e0b;
      --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      --font-mono:'Space Grotesk','Courier New',monospace;
      --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
      --shadow:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
    }
    body {
      font-family:var(--font-body);
      background:linear-gradient(145deg,#041d0e 0%,#0a2f18 40%,#113d22 80%,#082413 100%);
      background-attachment:fixed; min-height:100vh;
      color:var(--slate-900); -webkit-font-smoothing:antialiased;
    }

    /* ── TOPBAR ── */
    .topbar {
      position:sticky; top:0; z-index:100; height:60px;
      background:rgba(5,46,22,.97); backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 20px; box-shadow:0 2px 16px rgba(0,0,0,.3);
    }
    .topbar-brand { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .topbar-logo {
      height:48px; width:auto; border-radius:8px; object-fit:contain;
      background-color:#f5ebd9; padding:3px; box-shadow:0 2px 6px rgba(0,0,0,.15);
    }
    .topbar-text .title { font-size:15px; font-weight:800; color:#fff; line-height:1.1; }
    .topbar-text .sub { font-size:10px; font-weight:600; color:rgba(255,255,255,.6); letter-spacing:1px; text-transform:uppercase; }
    .topbar-actions { display:flex; align-items:center; gap:6px; }
    .tbtn {
      display:inline-flex; align-items:center; gap:5px; padding:6px 12px;
      border:none; border-radius:var(--radius-sm); font-family:var(--font-body);
      font-size:12px; font-weight:700; cursor:pointer; transition:all .18s; text-decoration:none;
    }
    .tbtn-inv { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.2); }
    .tbtn-logout { background:rgba(220,38,38,.2); color:#fca5a5; border:1px solid rgba(220,38,38,.3); }
    .tbtn:hover { filter:brightness(1.12); transform:translateY(-1px); }

    /* ── LAYOUT ── */
    .workspace {
      max-width:1200px; margin:20px auto; padding:0 20px;
      display:grid; grid-template-columns:1fr 360px; gap:20px; align-items:start;
    }
    @media(max-width:900px){ .workspace{ grid-template-columns:1fr; } }
    .panel { background:#fff; border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow); }
    h2 { font-size:15px; font-weight:700; color:var(--slate-900); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
    h3 { font-size:13px; font-weight:700; color:var(--slate-700); margin-bottom:10px; }
    .field-label {
      display:block; font-size:11px; font-weight:700; text-transform:uppercase;
      color:var(--slate-500); margin-bottom:6px; letter-spacing:.5px;
    }
    input[type="file"], select, textarea {
      width:100%; padding:10px 12px; border:1.5px solid var(--slate-200);
      border-radius:var(--radius-sm); font-family:var(--font-body); font-size:13px;
      outline:none; transition:border-color .2s; background:var(--slate-50); margin-bottom:14px;
    }
    textarea { resize:vertical; min-height:110px; line-height:1.6; }
    input:focus, textarea:focus, select:focus { border-color:var(--green-600); background:#fff; }
    .btn {
      width:100%; padding:11px; border:none; border-radius:var(--radius-sm);
      font-size:13px; font-weight:700; cursor:pointer; transition:.18s;
    }
    .btn-primary { background:var(--green-600); color:#fff; }
    .btn-primary:hover:not(:disabled) { background:var(--green-700); }
    .btn-danger { background:var(--red-600); color:#fff; }
    .btn-danger:hover:not(:disabled) { background:#b91c1c; }
    .btn-neutral { background:var(--slate-200); color:var(--slate-700); }
    .btn-neutral:hover:not(:disabled) { background:var(--slate-300); }
    .btn:disabled { opacity:.45; cursor:not-allowed; }

    /* ── BADGE ── */
    .var-badge {
      display:inline-block; padding:2px 7px; background:var(--slate-200);
      border-radius:4px; font-size:11px; cursor:pointer; font-family:var(--font-mono); margin:0 4px 8px 0;
    }
    .var-badge:hover { background:var(--slate-300); }

    /* ── PREVIEW TABLE ── */
    .preview-table { width:100%; border-collapse:collapse; margin-bottom:14px; font-size:12px; }
    .preview-table th,.preview-table td { padding:7px 10px; text-align:left; border-bottom:1px solid var(--slate-200); }
    .preview-table th { background:var(--slate-50); color:var(--slate-500); font-weight:700; text-transform:uppercase; font-size:10px; letter-spacing:.5px; }

    /* ── WA STATUS BOX ── */
    .wa-box {
      text-align:center; padding:20px; background:var(--slate-50);
      border-radius:var(--radius-md); border:1.5px dashed var(--slate-300); margin-bottom:16px;
    }
    .wa-box-text { font-weight:700; color:var(--slate-700); margin-bottom:12px; font-size:13px; }
    #qrCodeImg { max-width:190px; display:none; margin:0 auto 12px; border-radius:8px; border:4px solid #fff; box-shadow:0 4px 12px rgba(0,0,0,.15); }
    .status-pill {
      display:inline-flex; align-items:center; gap:5px; padding:3px 10px;
      border-radius:20px; font-size:11px; font-weight:700; margin-left:8px;
    }
    .status-pill::before { content:''; width:7px; height:7px; border-radius:50%; display:inline-block; }
    .status-pill.disconnected { background:#fee2e2; color:#991b1b; }
    .status-pill.disconnected::before { background:#dc2626; }
    .status-pill.initializing { background:#fef3c7; color:#92400e; }
    .status-pill.initializing::before { background:var(--amber-500); animation:pulse 1s infinite; }
    .status-pill.qr { background:#dbeafe; color:#1e40af; }
    .status-pill.qr::before { background:#3b82f6; animation:pulse 1s infinite; }
    .status-pill.ready { background:var(--green-100); color:var(--green-900); }
    .status-pill.ready::before { background:var(--green-600); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── MANUAL REVIEW BOX ── */
    .manual-box {
      display:none; background:var(--green-50); padding:16px;
      border-radius:var(--radius-sm); border:1.5px solid var(--green-600); margin-top:14px;
    }
    .manual-box textarea { min-height:80px; }
    .manual-box-actions { display:flex; gap:8px; }
    .manual-box-actions .btn { font-size:12px; padding:8px; }

    /* ── LOG BOX ── */
    .log-box {
      background:var(--slate-950); color:#94a3b8; font-family:var(--font-mono);
      font-size:11px; padding:12px; border-radius:var(--radius-sm); height:210px;
      overflow-y:auto; display:flex; flex-direction:column; gap:3px;
    }
    .le { border-bottom:1px solid rgba(255,255,255,.06); padding-bottom:3px; }
    .le-s { color:#4ade80; }
    .le-e { color:#f87171; }
    .le-w { color:#fbbf24; }
    .le-i { color:#94a3b8; }

    hr.sep { border:none; border-top:1px solid var(--slate-200); margin:20px 0; }
  </style>
</head>
<body>
  <script>
    if (!sessionStorage.getItem('bb_admin')) window.location.href = '/admin';
  </script>

  <!-- WhatsApp tool requires local Node.js server — show a banner if accessed on production hosting -->
  <script>
    (function() {
      const host = location.hostname;
      const isLocal = host === 'localhost' || host === '127.0.0.1' || host.startsWith('192.168.');
      if (!isLocal) {
        document.addEventListener('DOMContentLoaded', function() {
          const banner = document.createElement('div');
          banner.style.cssText = 'background:#fef3c7;border-bottom:2px solid #f59e0b;padding:14px 20px;font-size:13px;font-weight:600;color:#92400e;text-align:center;';
          banner.innerHTML = '⚠️ <strong>WhatsApp Bulk Sender requires the local server</strong> — this tool only works when you run <code style="background:#fde68a;padding:2px 6px;border-radius:4px;">node server.js</code> on your PC and access it via <a href="http://localhost:3000/whatsapp" style="color:#92400e;">http://localhost:3000/whatsapp</a>. It cannot run on the hosted website.';
          document.body.insertBefore(banner, document.body.firstChild);

          // Disable connect button
          const waitForBtn = setInterval(function() {
            const btn = document.getElementById('btnConnect');
            if (btn) {
              btn.disabled = true;
              btn.title = 'Run node server.js on your PC and use localhost:3000';
              clearInterval(waitForBtn);
            }
          }, 100);
        });
      }
    })();
  </script>


  <header class="topbar">
    <a href="/invoice" class="topbar-brand">
      <img src="/images/OurProducts/Logo_new.jpeg" alt="BrickBloom" class="topbar-logo" />
      <div class="topbar-text">
        <div class="title">BRICKBLOOM</div>
        <div class="sub">WhatsApp Bulk Sender</div>
      </div>
    </a>
    <div class="topbar-actions">
      <a href="/invoice" class="tbtn tbtn-inv">📄 Invoices</a>
      <button class="tbtn tbtn-logout" onclick="logout()">🚪 Logout</button>
    </div>
  </header>

  <div class="workspace">

    <!-- ── LEFT: Contacts + Template ── -->
    <div class="panel">
      <h2>1. Load Contacts (Excel / CSV)</h2>
      <label class="field-label">Upload file</label>
      <input type="file" id="excelFile" accept=".xlsx,.xls,.csv" />

      <div id="mappingSection" style="display:none;">
        <div style="display:flex;gap:10px;">
          <div style="flex:1;">
            <label class="field-label">Name Column</label>
            <select id="nameCol"></select>
          </div>
          <div style="flex:1;">
            <label class="field-label">Phone Column</label>
            <select id="phoneCol"></select>
          </div>
        </div>
        <label class="field-label">Preview (first 5)</label>
        <table class="preview-table" id="previewTable">
          <thead><tr><th>#</th><th>Name</th><th>Phone</th></tr></thead>
          <tbody></tbody>
        </table>
        <div id="contactCount" style="font-size:12px;color:var(--slate-500);margin-bottom:14px;"></div>
      </div>

      <hr class="sep" />

      <h2>2. Message Template</h2>
      <div>
        <span class="var-badge" onclick="insertVar('{name}')">+ {name}</span>
      </div>
      <label class="field-label">Template message</label>
      <textarea id="msgTemplate" placeholder="Hi {name}, we wanted to share..."></textarea>

      <label class="field-label">Attach media (optional — image or PDF)</label>
      <input type="file" id="mediaFile" accept="image/*,.pdf" />

      <label class="field-label">Live preview (first contact)</label>
      <div id="msgPreview" style="padding:12px;background:var(--green-50);border-radius:var(--radius-sm);font-size:13px;color:var(--slate-700);min-height:44px;white-space:pre-wrap;line-height:1.6;">
        Upload contacts and write a template to see preview.
      </div>
    </div>

    <!-- ── RIGHT: Connection + Send ── -->
    <div>

      <!-- WhatsApp Connection Panel -->
      <div class="panel" style="margin-bottom:16px;">
        <h2>WhatsApp <span id="statusPill" class="status-pill disconnected">Disconnected</span></h2>
        <div class="wa-box">
          <div class="wa-box-text" id="waStatusText">Not connected to WhatsApp.</div>
          <img id="qrCodeImg" alt="Scan QR Code" />
          <div id="waError" style="display:none;padding:8px;background:#fee2e2;border-radius:6px;font-size:12px;color:#991b1b;margin-bottom:10px;"></div>
          <button class="btn btn-primary" id="btnConnect" onclick="connectWA()">Connect WhatsApp Web</button>
          <button class="btn btn-danger" id="btnDisconnect" style="display:none;margin-top:8px;" onclick="disconnectWA()">Disconnect</button>
        </div>
      </div>

      <!-- Send Panel -->
      <div class="panel">
        <h2>3. Send Messages</h2>

        <label class="field-label">Mode</label>
        <div style="display:flex;gap:10px;margin-bottom:14px;">
          <label style="flex:1;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;">
            <input type="radio" name="sendMode" value="auto" checked onchange="onModeChange()" /> Auto Batch
          </label>
          <label style="flex:1;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;">
            <input type="radio" name="sendMode" value="manual" onchange="onModeChange()" /> Manual (1-by-1)
          </label>
        </div>

        <label class="field-label">Batch size</label>
        <select id="batchSelect">
          <option value="all">All contacts</option>
          <option value="10">First 10</option>
          <option value="20">First 20</option>
          <option value="50">First 50</option>
        </select>

        <label class="field-label">Delay between messages</label>
        <select id="delaySelect">
          <option value="3000">3 seconds (default)</option>
          <option value="5000">5 seconds (safer)</option>
          <option value="8000">8 seconds (safest)</option>
        </select>

        <button class="btn btn-primary" id="btnSend" onclick="startSending()" disabled>Start Sending</button>

        <!-- Manual review box -->
        <div class="manual-box" id="manualBox">
          <h3 id="manualHeader">Review Contact 1 of N</h3>
          <div style="font-size:13px;font-weight:600;color:var(--slate-700);margin-bottom:10px;" id="manualInfo"></div>
          <label class="field-label">Edit message before sending:</label>
          <textarea id="manualMsg"></textarea>
          <div class="manual-box-actions">
            <button class="btn btn-primary" onclick="manualSend()">🚀 Send &amp; Next</button>
            <button class="btn btn-neutral" onclick="manualSkip()">⏭️ Skip</button>
            <button class="btn btn-danger" onclick="manualStop()">⏹️ Stop</button>
          </div>
        </div>

        <label class="field-label" style="margin-top:16px;">Activity log</label>
        <div class="log-box" id="logBox">
          <div class="le le-i">System ready.</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────────
    let contacts   = [];
    let rawData    = [];
    let sseSource  = null;
    let waReady    = false;

    let manualBatch = [];
    let manualIdx   = 0;

    // ── Logging ────────────────────────────────────────────────────────────────
    function log(msg, type = 'i') {
      const box  = document.getElementById('logBox');
      const time = new Date().toLocaleTimeString();
      box.insertAdjacentHTML('beforeend', `<div class="le le-${type}">[${time}] ${msg}</div>`);
      box.scrollTop = box.scrollHeight;
    }

    // ── Excel / CSV ────────────────────────────────────────────────────────────
    document.getElementById('excelFile').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        try {
          let wb;
          if (file.name.toLowerCase().endsWith('.csv')) {
            wb = XLSX.read(ev.target.result, { type: 'string' });
          } else {
            wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
          }
          rawData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
          if (!rawData.length) return alert('Spreadsheet appears empty.');
          setupMapping(Object.keys(rawData[0]));
        } catch (err) {
          alert('Could not read file: ' + err.message);
        }
      };
      file.name.toLowerCase().endsWith('.csv')
        ? reader.readAsText(file, 'utf-8')
        : reader.readAsArrayBuffer(file);
    });

    function setupMapping(headers) {
      const ns = document.getElementById('nameCol');
      const ps = document.getElementById('phoneCol');
      ns.innerHTML = ps.innerHTML = '';
      let bestN = '', bestP = '';
      headers.forEach(h => {
        const hl = h.toLowerCase();
        if (/name|customer|company|client/.test(hl)) bestN = h;
        if (/phone|mobile|number|whatsapp|wa/.test(hl)) bestP = h;
        ns.add(new Option(h, h));
        ps.add(new Option(h, h));
      });
      if (bestN) ns.value = bestN;
      if (bestP) ps.value = bestP;
      document.getElementById('mappingSection').style.display = 'block';
      buildContacts();
      ns.onchange = ps.onchange = buildContacts;
    }

    function buildContacts() {
      const nc = document.getElementById('nameCol').value;
      const pc = document.getElementById('phoneCol').value;
      contacts = rawData
        .map(r => ({ name: String(r[nc] || '').trim(), phone: String(r[pc] || '').replace(/[^0-9+]/g, '') }))
        .filter(c => c.phone.length >= 10);
      const tbody = document.querySelector('#previewTable tbody');
      tbody.innerHTML = '';
      contacts.slice(0, 5).forEach((c, i) => {
        tbody.insertAdjacentHTML('beforeend', `<tr><td>${i + 1}</td><td>${c.name}</td><td>${c.phone}</td></tr>`);
      });
      const more = contacts.length - 5;
      if (more > 0) tbody.insertAdjacentHTML('beforeend', `<tr><td colspan="3" style="text-align:center;color:var(--slate-500);">…and ${more} more</td></tr>`);
      document.getElementById('contactCount').textContent = `${contacts.length} contacts loaded`;
      refreshPreview();
      checkReady();
    }

    // ── Template preview ───────────────────────────────────────────────────────
    document.getElementById('msgTemplate').addEventListener('input', refreshPreview);

    function insertVar(v) {
      const el = document.getElementById('msgTemplate');
      const s = el.selectionStart, e = el.selectionEnd;
      el.value = el.value.slice(0, s) + v + el.value.slice(e);
      el.focus();
      el.selectionStart = el.selectionEnd = s + v.length;
      refreshPreview();
    }

    function mergeMsg(template, contact) {
      return template.replace(/{name}/gi, contact.name || 'Customer');
    }

    function refreshPreview() {
      const tmpl = document.getElementById('msgTemplate').value;
      const el   = document.getElementById('msgPreview');
      el.textContent = (contacts.length && tmpl.trim())
        ? mergeMsg(tmpl, contacts[0])
        : 'Upload contacts and write a template to see preview.';
      checkReady();
    }

    // ── Mode switch ────────────────────────────────────────────────────────────
    function onModeChange() {
      const isManual = document.querySelector('input[name="sendMode"]:checked').value === 'manual';
      document.getElementById('btnSend').textContent = isManual ? 'Review & Start Sending' : 'Start Sending';
    }

    // ── checkReady ─────────────────────────────────────────────────────────────
    function checkReady() {
      const tmpl     = document.getElementById('msgTemplate').value.trim();
      const hasMedia = document.getElementById('mediaFile').files.length > 0;
      document.getElementById('btnSend').disabled = !(waReady && contacts.length && (tmpl || hasMedia));
    }

    // ── SSE / WA status ────────────────────────────────────────────────────────
    function openSSE() {
      if (sseSource) { sseSource.close(); sseSource = null; }
      sseSource = new EventSource('/api/wa/stream');

      sseSource.addEventListener('state', e => {
        try { applyState(JSON.parse(e.data)); } catch (_) {}
      });

      // SSE `error` fires when the browser HTTP connection drops (e.g., server restart).
      // Don't treat this as a WA disconnect — it will auto-reconnect.
      sseSource.onerror = () => {
        // browser will retry automatically; no UI change needed
      };
    }

    function applyState(s) {
      const status = s.status || 'disconnected';
      waReady = status === 'ready';

      const pill      = document.getElementById('statusPill');
      const text      = document.getElementById('waStatusText');
      const qr        = document.getElementById('qrCodeImg');
      const errDiv    = document.getElementById('waError');
      const btnC      = document.getElementById('btnConnect');
      const btnD      = document.getElementById('btnDisconnect');

      pill.className = 'status-pill ' + status;

      if (status === 'ready') {
        pill.textContent  = '✓ Connected';
        text.textContent  = 'WhatsApp Web is active and ready to send.';
        qr.style.display  = 'none';
        btnC.style.display = 'none';
        btnD.style.display = 'block';
        errDiv.style.display = 'none';
      } else if (status === 'qr') {
        pill.textContent  = 'Scan QR Code';
        text.textContent  = 'Open WhatsApp → Linked Devices → Link a Device, then scan:';
        qr.style.display  = 'block';
        if (s.qr) qr.src  = s.qr;
        btnC.style.display = 'none';
        btnD.style.display = 'block';
        errDiv.style.display = 'none';
      } else if (status === 'initializing') {
        pill.textContent  = 'Starting…';
        text.textContent  = 'Launching WhatsApp Web — please wait…';
        qr.style.display  = 'none';
        btnC.style.display = 'none';
        btnD.style.display = 'block';
        errDiv.style.display = 'none';
      } else {
        pill.textContent  = 'Disconnected';
        text.textContent  = 'Not connected to WhatsApp.';
        qr.style.display  = 'none';
        btnC.style.display = 'block';
        btnD.style.display = 'none';
        if (s.error) {
          errDiv.textContent   = '⚠️ ' + s.error;
          errDiv.style.display = 'block';
        } else {
          errDiv.style.display = 'none';
        }
        btnC.disabled = false;
      }
      checkReady();
    }

    async function checkWAStatus() {
      try {
        const r = await fetch('/api/wa/status');
        const d = await r.json();
        applyState(d);
      } catch (_) {}
    }

    async function connectWA() {
      document.getElementById('btnConnect').disabled = true;
      log('Connecting to WhatsApp Web…', 'i');
      try {
        const r = await fetch('/api/wa/connect', { method: 'POST' });
        if (!r.ok) throw new Error('Server error ' + r.status);
      } catch (err) {
        log('Connect failed: ' + err.message, 'e');
        document.getElementById('btnConnect').disabled = false;
      }
    }

    async function disconnectWA() {
      log('Disconnecting…', 'i');
      try {
        await fetch('/api/wa/disconnect', { method: 'POST' });
      } catch (_) {}
    }

    // ── Read media attachment as base64 ────────────────────────────────────────
    async function readMedia() {
      const input = document.getElementById('mediaFile');
      if (!input.files.length) return null;
      const file = input.files[0];
      const b64  = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload  = () => res(fr.result);
        fr.onerror = rej;
        fr.readAsDataURL(file);
      });
      return { mimetype: file.type, data: b64.split(',')[1], filename: file.name };
    }

    // ── Stream reader helper ────────────────────────────────────────────────────
    async function readNDJSONStream(response, onRow) {
      const reader  = response.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop(); // keep incomplete last line
        for (const line of lines) {
          if (!line.trim()) continue;
          try { onRow(JSON.parse(line)); } catch (_) {}
        }
      }
      // flush remainder
      if (buf.trim()) { try { onRow(JSON.parse(buf)); } catch (_) {} }
    }

    // ── Auto batch send ────────────────────────────────────────────────────────
    async function sendBatch(toSend, template, media) {
      document.getElementById('btnSend').disabled = true;
      log(`Sending to ${toSend.length} contacts…`, 'i');

      try {
        const r = await fetch('/api/wa/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contacts:  toSend,
            template:  template,
            media:     media,
            delay_ms:  parseInt(document.getElementById('delaySelect').value)
          })
        });

        if (!r.ok) {
          const e = await r.json().catch(() => ({ error: 'Unknown error' }));
          throw new Error(e.error || ('Server ' + r.status));
        }

        await readNDJSONStream(r, row => {
          if (row.status === 'success') log(`✅ Sent to ${row.name} (${row.phone})`, 's');
          else if (row.status === 'error')  log(`❌ ${row.name} (${row.phone}): ${row.error}`, 'e');
          else if (row.status === 'fatal')  { log(`🔴 ${row.error}`, 'e'); applyState({ status: 'disconnected', error: row.error }); }
          else if (row.status === 'done')   log('✔ Batch complete!', 'i');
        });
      } catch (err) {
        log('Send error: ' + err.message, 'e');
      }

      document.getElementById('btnSend').disabled = !waReady;
    }

    // ── Start sending (entry point) ────────────────────────────────────────────
    async function startSending() {
      const batchStr = document.getElementById('batchSelect').value;
      const limit    = batchStr === 'all' ? contacts.length : parseInt(batchStr);
      const toSend   = contacts.slice(0, limit);
      const template = document.getElementById('msgTemplate').value;
      const mode     = document.querySelector('input[name="sendMode"]:checked').value;

      if (!toSend.length) return alert('No valid contacts loaded.');

      const media = await readMedia();

      if (mode === 'manual') {
        manualBatch = toSend;
        manualIdx   = 0;
        document.getElementById('btnSend').style.display = 'none';
        document.getElementById('manualBox').style.display = 'block';
        loadManualContact();
        return;
      }

      if (!confirm(`Send to ${toSend.length} contacts?`)) return;
      await sendBatch(toSend, template, media);
    }

    // ── Manual mode ────────────────────────────────────────────────────────────
    function loadManualContact() {
      if (manualIdx >= manualBatch.length) {
        log('Manual batch complete!', 'i');
        manualStop();
        return;
      }
      const c    = manualBatch[manualIdx];
      const tmpl = document.getElementById('msgTemplate').value;
      document.getElementById('manualHeader').textContent = `Review ${manualIdx + 1} of ${manualBatch.length}`;
      document.getElementById('manualInfo').textContent   = `${c.name}  •  ${c.phone}`;
      document.getElementById('manualMsg').value          = mergeMsg(tmpl, c);
    }

    async function manualSend() {
      const c       = manualBatch[manualIdx];
      const msg     = document.getElementById('manualMsg').value;
      const media   = await readMedia();
      log(`Sending to ${c.name}…`, 'i');
      try {
        const r = await fetch('/api/wa/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contacts: [c], template: msg, media })
        });
        await readNDJSONStream(r, row => {
          if (row.status === 'success') log(`✅ Sent to ${row.name}`, 's');
          else if (row.status === 'error') log(`❌ ${row.name}: ${row.error}`, 'e');
        });
      } catch (err) {
        log('Send error: ' + err.message, 'e');
      }
      manualIdx++;
      loadManualContact();
    }

    function manualSkip() {
      log(`Skipped ${manualBatch[manualIdx].name}`, 'w');
      manualIdx++;
      loadManualContact();
    }

    function manualStop() {
      document.getElementById('manualBox').style.display = 'none';
      document.getElementById('btnSend').style.display  = 'block';
      checkReady();
    }

    function logout() {
      sessionStorage.removeItem('bb_admin');
      window.location.href = '/admin';
    }

    // ── Init ───────────────────────────────────────────────────────────────────
    openSSE();
    checkWAStatus();
    document.getElementById('mediaFile').addEventListener('change', checkReady);
  </script>
</body>
</html>
