<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>BrickBloom — Tax Invoice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* ── Reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    /* ── Design Tokens ──────────────────────────────────────────────────── */
    :root {
      --green-950: #052e16;
      --green-900: #14532d;
      --green-800: #166534;
      --green-700: #15803d;
      --green-600: #16a34a;
      --green-100: #dcfce7;
      --green-50:  #f0fdf4;

      --slate-950: #020617;
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-300: #cbd5e1;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50:  #f8fafc;

      --amber-600: #d97706;
      --amber-500: #f59e0b;
      --red-600:   #dc2626;
      --blue-600:  #2563eb;
      --blue-500:  #3b82f6;

      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Space Grotesk', 'Courier New', monospace;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.10), 0 4px 8px rgba(0,0,0,0.05);
      --shadow-xl: 0 20px 48px rgba(0,0,0,0.14), 0 8px 16px rgba(0,0,0,0.07);
    }

    /* ── Body / Page ────────────────────────────────────────────────────── */
    body {
      font-family: var(--font-body);
      background: linear-gradient(145deg, #041d0e 0%, #0a2f18 40%, #113d22 80%, #082413 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--slate-900);
      -webkit-font-smoothing: antialiased;
    }

    /* ══════════════════════════════════════════════════════════════════════
       TOP BAR
    ══════════════════════════════════════════════════════════════════════ */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 60px;
      background: rgba(5, 46, 22, 0.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.3);
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .topbar-logo {
      height: 40px;
      width: auto;
      border-radius: 7px;
      object-fit: contain;
    }
    .topbar-text .title {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
    }
    .topbar-text .sub {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Topbar buttons */
    .tbtn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s;
    }
    .tbtn-auto   { background: var(--amber-500); color: #fff; }
    .tbtn-save   { background: var(--green-600); color: #fff; }
    .tbtn-list   { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    .tbtn-img    { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    .tbtn-pdf    { background: var(--blue-600); color: #fff; }
    .tbtn-reset  { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.15); }
    .tbtn-logout { background: rgba(220,38,38,0.2); color: #fca5a5; border: 1px solid rgba(220,38,38,0.3); }
    .tbtn:hover  { filter: brightness(1.12); transform: translateY(-1px); }

    /* Hamburger for mobile */
    .topbar-hamburger {
      display: none;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      padding: 6px;
      background: none;
      border: none;
    }
    .topbar-hamburger span {
      display: block;
      width: 22px;
      height: 2px;
      background: rgba(255,255,255,0.8);
      border-radius: 2px;
      transition: all 0.2s;
    }

    /* Mobile action menu */
    .mobile-actions {
      display: none;
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      z-index: 99;
      background: rgba(5,46,22,0.98);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 12px 16px;
      flex-direction: column;
      gap: 8px;
    }
    .mobile-actions.open { display: flex; }
    .mobile-actions .tbtn { width: 100%; justify-content: center; padding: 10px; font-size: 13px; }

    /* ══════════════════════════════════════════════════════════════════════
       DRAWER (Saved Invoices)
    ══════════════════════════════════════════════════════════════════════ */
    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(3px);
      z-index: 200;
    }
    .drawer-overlay.open { display: block; }

    .drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: min(440px, 100vw);
      height: 100dvh;
      background: white;
      z-index: 201;
      display: flex;
      flex-direction: column;
      transition: right 0.32s cubic-bezier(0.16,1,0.3,1);
      box-shadow: -8px 0 40px rgba(0,0,0,0.3);
    }
    .drawer.open { right: 0; }

    .drawer-head {
      background: linear-gradient(135deg, var(--green-950), var(--green-800));
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .drawer-head-title { font-size: 15px; font-weight: 800; }
    .drawer-head-sub   { font-size: 10px; opacity: 0.75; margin-top: 2px; letter-spacing: 0.5px; }
    .drawer-close-btn  {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.15);
      border: none; color: white;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .drawer-close-btn:hover { background: rgba(255,255,255,0.28); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 14px; background: var(--slate-50); }

    /* Saved invoice cards */
    .inv-saved-card {
      background: white;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      transition: all 0.18s;
    }
    .inv-saved-card:hover { border-color: var(--green-600); box-shadow: var(--shadow-md); }
    .isc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .isc-refno { font-size: 13px; font-weight: 800; color: var(--green-900); font-family: var(--font-mono); }
    .isc-date  { font-size: 11px; color: var(--slate-500); }
    .isc-cust  { font-size: 12.5px; font-weight: 600; color: var(--slate-800); margin-bottom: 4px; }
    .isc-total { font-size: 14px; font-weight: 800; color: var(--green-700); font-family: var(--font-mono); }
    .isc-actions { display: flex; gap: 6px; margin-top: 10px; }
    .isc-btn {
      flex: 1; padding: 7px 8px;
      border-radius: 6px; border: none;
      font-size: 11px; font-weight: 700;
      cursor: pointer; font-family: var(--font-body);
      transition: all 0.15s;
    }
    .isc-edit  { background: #eff6ff; color: #1d4ed8; }
    .isc-clone { background: var(--green-50); color: var(--green-700); }
    .isc-del   { background: #fef2f2; color: var(--red-600); }
    .isc-edit:hover  { background: #dbeafe; }
    .isc-clone:hover { background: var(--green-100); }
    .isc-del:hover   { background: #fee2e2; }
    .drawer-empty { text-align: center; padding: 48px 20px; color: var(--slate-400); }
    .drawer-empty-icon { font-size: 40px; margin-bottom: 10px; }

    /* ══════════════════════════════════════════════════════════════════════
       MAIN WORKSPACE
    ══════════════════════════════════════════════════════════════════════ */
    .workspace {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ── Left Column: Form ──────────────────────────────────────────────── */
    .form-col { display: flex; flex-direction: column; gap: 14px; }

    /* Editing badge */
    .editing-badge {
      display: none;
      background: #fffbeb;
      border: 1.5px solid var(--amber-500);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      color: #92400e;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .editing-badge.visible { display: flex; }
    .editing-badge-btns { display: flex; gap: 6px; }
    .eb-btn {
      padding: 4px 10px;
      border: none;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font-body);
    }
    .eb-new   { background: var(--green-700); color: white; }
    .eb-blank { background: var(--amber-500); color: white; }

    /* Form panel card */
    .panel {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    .panel-head {
      background: linear-gradient(90deg, var(--slate-800) 0%, var(--slate-700) 100%);
      color: white;
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-body { padding: 16px; }

    /* Form fields */
    .field-grid { display: grid; gap: 10px; }
    .field-grid.cols-2 { grid-template-columns: 1fr 1fr; }
    .field-grid.cols-1 { grid-template-columns: 1fr; }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--slate-500);
    }
    .field input, .field textarea, .field select {
      padding: 9px 12px;
      border: 1.5px solid var(--slate-200);
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--slate-900);
      font-family: var(--font-body);
      background: var(--slate-50);
      transition: all 0.18s;
      outline: none;
      width: 100%;
    }
    .field textarea { resize: vertical; min-height: 54px; line-height: 1.4; }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: var(--green-700);
      background: white;
      box-shadow: 0 0 0 3px rgba(21,128,61,0.12);
    }

    /* Items editor table */
    .items-scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 10px; }
    .items-tbl { width: 100%; border-collapse: collapse; min-width: 380px; }
    .items-tbl th {
      background: var(--slate-100);
      padding: 7px 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--slate-600);
      white-space: nowrap;
    }
    .items-tbl td { padding: 3px 3px; border-bottom: 1px solid var(--slate-100); vertical-align: middle; }
    .items-tbl input {
      width: 100%;
      padding: 6px 7px;
      border: 1.5px solid var(--slate-200);
      border-radius: 5px;
      font-size: 12px;
      font-family: var(--font-body);
      background: white;
      outline: none;
    }
    .items-tbl input.r { text-align: right; font-variant-numeric: tabular-nums; }
    .items-tbl input:focus { border-color: var(--green-700); box-shadow: 0 0 0 2px rgba(21,128,61,0.12); }
    .row-del {
      background: none; border: none;
      color: var(--slate-300);
      cursor: pointer; font-size: 15px;
      padding: 4px 6px;
      border-radius: 4px;
      transition: all 0.15s;
      display: block;
      line-height: 1;
    }
    .row-del:hover { color: var(--red-600); background: #fee2e2; }
    .add-row-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      border: 1.5px dashed var(--green-700);
      border-radius: var(--radius-sm);
      background: rgba(21,128,61,0.04);
      color: var(--green-700);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.18s;
    }
    .add-row-btn:hover { background: rgba(21,128,61,0.1); }

    /* Totals mini panel */
    .totals-grid { display: grid; gap: 8px; }
    .total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
    .total-row label { font-weight: 600; color: var(--slate-600); }
    .total-row .tval { font-weight: 700; color: var(--slate-900); font-variant-numeric: tabular-nums; }
    .total-row.grand { padding-top: 10px; border-top: 2px solid var(--slate-200); }
    .total-row.grand label { color: var(--green-900); font-size: 14px; font-weight: 800; }
    .total-row.grand .tval { color: var(--green-700); font-size: 15px; font-weight: 800; font-family: var(--font-mono); }
    .num-input {
      width: 110px;
      padding: 6px 10px;
      border: 1.5px solid var(--slate-200);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: var(--font-body);
      outline: none;
      background: var(--slate-50);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .tax-select {
      width: 100%;
      padding: 7px 10px;
      border: 1.5px solid var(--slate-200);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-family: var(--font-body);
      outline: none;
      background: var(--slate-50);
      cursor: pointer;
    }
    .tax-select:focus { border-color: var(--green-700); box-shadow: 0 0 0 2px rgba(21,128,61,0.12); }

    /* ── Right Column: Invoice Preview ──────────────────────────────────── */
    .preview-col {
      position: sticky;
      top: 76px;
      max-height: calc(100dvh - 96px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .export-btns {
      display: flex;
      gap: 10px;
    }
    .export-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 700;
      font-family: var(--font-body);
      cursor: pointer;
      color: white;
      transition: all 0.18s;
    }
    .export-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .export-img { background: linear-gradient(135deg, #d97706, #b45309); }
    .export-pdf { background: linear-gradient(135deg, #2563eb, #1d4ed8); }

    /* ══════════════════════════════════════════════════════════════════════
       THE INVOICE DOCUMENT
       Industry-standard: Compact, no column gaps, clear data hierarchy
    ══════════════════════════════════════════════════════════════════════ */
    #invoiceDoc {
      background: white;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      font-size: 12.5px;
      color: var(--slate-800);
      line-height: 1.45;
    }

    /* ─ Accent top stripe ── */
    .inv-stripe {
      height: 5px;
      background: linear-gradient(90deg, #052e16 0%, #166534 35%, #16a34a 65%, #f59e0b 100%);
    }

    /* ─ Header (Logo + Company info + Invoice Title) ── */
    .inv-header {
      padding: 20px 24px 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: start;
      border-bottom: 2px solid var(--slate-100);
    }

    .inv-company-logo {
      height: 50px;
      width: auto;
      border-radius: 7px;
      object-fit: contain;
      border: 1px solid rgba(0,0,0,0.06);
      margin-bottom: 8px;
      display: block;
    }
    .inv-company-name {
      font-size: 20px;
      font-weight: 800;
      color: var(--green-900);
      letter-spacing: -0.3px;
      margin-bottom: 2px;
    }
    .inv-company-tagline {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--green-700);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .inv-company-addr {
      font-size: 11px;
      color: var(--slate-600);
      line-height: 1.55;
    }
    .inv-contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 5px;
      font-size: 11px;
    }
    .inv-contact-row a {
      color: var(--green-700);
      text-decoration: none;
      font-weight: 600;
    }

    /* Right side of header: invoice title + details */
    .inv-header-right {
      text-align: right;
      min-width: 180px;
    }
    .inv-doc-type-tag {
      display: inline-block;
      background: var(--green-900);
      color: white;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 5px;
      margin-bottom: 8px;
      font-family: var(--font-mono);
    }
    .inv-doc-original {
      font-size: 10px;
      color: var(--slate-500);
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .inv-header-kv { display: grid; gap: 3px; }
    .inv-hkv-row {
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      gap: 8px;
      font-size: 11.5px;
    }
    .inv-hkv-k { color: var(--slate-500); font-weight: 600; white-space: nowrap; }
    .inv-hkv-v {
      color: var(--slate-900);
      font-weight: 700;
      text-align: right;
    }
    .inv-hkv-v.inv-refno {
      color: var(--green-800);
      font-size: 14px;
      font-weight: 800;
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
    }

    /* ─ Bill To + Invoice Meta band ── */
    .inv-parties {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--slate-100);
    }
    .inv-party {
      padding: 14px 20px 14px 24px;
    }
    .inv-party + .inv-party {
      padding-left: 20px;
      padding-right: 24px;
      border-left: 1px solid var(--slate-100);
    }
    .inv-party-label {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--green-700);
      margin-bottom: 6px;
    }
    .inv-buyer-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--slate-900);
      margin-bottom: 4px;
    }
    .inv-buyer-info {
      font-size: 11.5px;
      color: var(--slate-600);
      line-height: 1.55;
    }
    .inv-buyer-info strong { color: var(--slate-800); font-weight: 600; }

    /* Seller meta (payment info on right side) */
    .inv-meta-rows { display: grid; gap: 5px; }
    .inv-meta-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
    }
    .inv-meta-k { color: var(--slate-500); font-weight: 600; white-space: nowrap; }
    .inv-meta-v { color: var(--slate-900); font-weight: 700; text-align: right; }

    /* ─ Line Items Table ── */
    .inv-items-section { padding: 0 24px; }
    .inv-items-heading {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--green-700);
      padding: 12px 0 6px;
      border-top: 1px solid var(--slate-100);
    }

    .inv-tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      table-layout: fixed;
    }
    /* Fixed column widths — no gaps */
    .inv-tbl col.c-sr    { width: 36px; }
    .inv-tbl col.c-desc  { width: auto; }
    .inv-tbl col.c-hsn   { width: 72px; }
    .inv-tbl col.c-qty   { width: 52px; }
    .inv-tbl col.c-rate  { width: 80px; }
    .inv-tbl col.c-taxable { width: 84px; }
    .inv-tbl col.c-gst   { width: 68px; }
    .inv-tbl col.c-total { width: 84px; }

    .inv-tbl thead th {
      background: var(--slate-800);
      color: white;
      padding: 9px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      text-align: right;
      white-space: nowrap;
    }
    .inv-tbl thead th:first-child { text-align: center; border-radius: 0; }
    .inv-tbl thead th:nth-child(2) { text-align: left; }

    .inv-tbl tbody td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--slate-100);
      vertical-align: middle;
      text-align: right;
    }
    .inv-tbl tbody td:first-child { text-align: center; color: var(--slate-400); font-size: 11px; font-weight: 700; }
    .inv-tbl tbody td:nth-child(2) { text-align: left; }

    .inv-tbl tbody tr:last-child td { border-bottom: none; }
    .inv-tbl tbody tr:nth-child(even) td { background: rgba(248,250,252,0.6); }

    .inv-item-name { font-weight: 700; color: var(--slate-900); font-size: 12.5px; }
    .inv-item-sub  { font-size: 10px; color: var(--slate-500); margin-top: 1px; }

    /* Subtotal / totals rows */
    .inv-tbl .subtotal-row td {
      background: var(--slate-50) !important;
      border-top: 2px solid var(--slate-300);
      border-bottom: 2px solid var(--slate-300);
      padding: 9px 8px;
      font-size: 12px;
      font-weight: 800;
      color: var(--slate-800);
    }
    .inv-tbl .subtotal-row td:nth-child(2) { text-align: left; }

    /* ─ Financial Summary Rows ── */
    .inv-financials {
      display: grid;
      grid-template-columns: 1fr auto;
      border-top: 1px solid var(--slate-100);
    }

    /* Left: amount in words + bank */
    .inv-fin-left {
      padding: 16px 20px 16px 24px;
      border-right: 1px solid var(--slate-100);
    }
    .inv-fin-section-title {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--green-700);
      margin-bottom: 5px;
    }
    .inv-words {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--slate-700);
      font-style: italic;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .inv-bank-table {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 10px;
      font-size: 11px;
    }
    .ibt-k { color: var(--slate-500); font-weight: 600; }
    .ibt-v { color: var(--slate-800); font-weight: 700; }

    /* Right: summary card */
    .inv-fin-right { padding: 16px 24px 16px 20px; min-width: 220px; }
    .inv-summary-rows { display: grid; gap: 6px; margin-bottom: 12px; }
    .inv-sum-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .inv-sum-k { color: var(--slate-600); font-weight: 600; }
    .inv-sum-v { color: var(--slate-900); font-weight: 700; font-variant-numeric: tabular-nums; }
    .inv-sum-divider { height: 1px; background: var(--slate-200); margin: 4px 0; }

    .inv-grand-row {
      background: linear-gradient(135deg, var(--green-950), var(--green-800));
      color: white;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .inv-grand-k { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; opacity: 0.9; }
    .inv-grand-v { font-size: 20px; font-weight: 800; font-family: var(--font-mono); }

    /* ─ Terms + Signature ── */
    .inv-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 14px 24px 20px;
      border-top: 1px solid var(--slate-100);
      gap: 20px;
    }
    .inv-terms {
      flex: 1;
      font-size: 10.5px;
      color: var(--slate-500);
      line-height: 1.55;
    }
    .inv-terms strong { color: var(--slate-700); display: block; margin-bottom: 3px; }
    .inv-sign {
      text-align: right;
      flex-shrink: 0;
    }
    .inv-sign-co {
      font-size: 12px;
      font-weight: 800;
      color: var(--green-900);
      margin-bottom: 34px;
    }
    .inv-sign-line {
      font-size: 10px;
      color: var(--slate-500);
      border-top: 1.5px solid var(--slate-300);
      padding-top: 4px;
      min-width: 130px;
      display: inline-block;
      text-align: center;
    }

    /* ─ Tagline ── */
    .inv-tagline {
      background: var(--slate-50);
      border-top: 1px solid var(--slate-200);
      padding: 9px 24px;
      text-align: center;
      font-size: 10.5px;
      color: var(--slate-500);
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* ── Toast ──────────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--slate-900);
      color: white;
      padding: 11px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.32s cubic-bezier(0.16,1,0.3,1);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 340px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok  { background: var(--green-700); }
    .toast.err { background: var(--red-600); }

    /* ══════════════════════════════════════════════════════════════════════
       PRINT STYLES
    ══════════════════════════════════════════════════════════════════════ */
    @media print {
      @page { size: A4 portrait; margin: 5mm; }
      body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .topbar, .mobile-actions, .drawer-overlay, .drawer,
      .form-col, .export-btns, .editing-badge, .toast {
        display: none !important;
      }
      .workspace {
        display: block !important;
        padding: 0 !important;
        max-width: 100% !important;
      }
      .preview-col {
        position: static !important;
        max-height: none !important;
        overflow: visible !important;
      }
      #invoiceDoc {
        box-shadow: none !important;
        border-radius: 0 !important;
        border: 1px solid var(--slate-300) !important;
        font-size: 10.5px !important;
        max-height: 285mm;
        overflow: hidden;
      }
      /* Compact vertical padding for single-page print fit */
      .inv-header { padding: 12px 16px 10px !important; gap: 8px !important; }
      .inv-company-logo { height: 42px !important; margin-bottom: 4px !important; }
      .inv-party { padding: 10px 16px !important; }
      .inv-items-heading { padding: 8px 0 4px !important; }
      .inv-tbl th, .inv-tbl td { padding: 6px 6px !important; }
      .inv-tbl .subtotal-row td { padding: 6px 6px !important; }
      .inv-fin-left, .inv-fin-right { padding: 10px 16px !important; }
      .inv-summary-rows { margin-bottom: 8px !important; gap: 4px !important; }
      .inv-grand-row { padding: 8px 12px !important; }
      .inv-footer-row { padding: 10px 16px 12px !important; gap: 10px !important; }
      .inv-sign-co { margin-bottom: 24px !important; }
      .inv-tagline { padding: 6px 16px !important; font-size: 9.5px !important; }
    }

    /* ══════════════════════════════════════════════════════════════════════
       MOBILE RESPONSIVE (≤768px)
    ══════════════════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      /* Hide desktop topbar action buttons, show hamburger */
      .topbar-actions { display: none; }
      .topbar-hamburger { display: flex; }

      /* Stack workspace */
      .workspace {
        grid-template-columns: 1fr;
        padding: 12px;
        gap: 14px;
      }

      /* Preview comes BELOW form on mobile */
      .preview-col {
        position: static;
        max-height: none;
        overflow: visible;
        order: 2;
      }
      .form-col { order: 1; }

      /* Invoice doc: compact mobile view */
      .inv-header {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 16px;
      }
      .inv-header-right { text-align: left; }
      .inv-hkv-row { justify-content: flex-start; }

      .inv-parties { grid-template-columns: 1fr; }
      .inv-party + .inv-party { border-left: none; border-top: 1px solid var(--slate-100); }
      .inv-party { padding: 12px 16px; }

      .inv-items-section { padding: 0 16px; }

      /* Hide HSN column on mobile */
      .inv-tbl col.c-hsn,
      .inv-tbl th:nth-child(3),
      .inv-tbl td:nth-child(3) { display: none; }

      .inv-financials { grid-template-columns: 1fr; }
      .inv-fin-left { border-right: none; border-bottom: 1px solid var(--slate-100); padding: 14px 16px; }
      .inv-fin-right { padding: 14px 16px; min-width: unset; }

      .inv-footer-row { flex-direction: column; gap: 16px; padding: 14px 16px; }
      .inv-terms { max-width: 100%; }

      /* Export buttons stack */
      .export-btns { flex-direction: column; }

      /* Field grids: single col on mobile */
      .field-grid.cols-2 { grid-template-columns: 1fr; }

      /* Toast */
      .toast { left: 16px; right: 16px; max-width: none; bottom: 16px; }
    }

    @media (max-width: 480px) {
      .topbar { padding: 0 14px; height: 54px; }
      .topbar-logo { height: 36px; }
      .topbar-text .title { font-size: 14px; }
      .workspace { padding: 10px; }
    }
  </style>
</head>
<body>

  <!-- Auth guard -->
  <script>
    if (!sessionStorage.getItem('bb_admin')) {
      window.location.replace('/admin');
    }
  </script>

  <!-- Drawer overlay -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

  <!-- Saved Invoices Drawer -->
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <div>
        <div class="drawer-head-title">📋 Saved Invoices</div>
        <div class="drawer-head-sub">Stored in repo: <strong>invoices/</strong> folder</div>
      </div>
      <button class="drawer-close-btn" onclick="closeDrawer()">×</button>
    </div>
    <div class="drawer-body" id="invoicesList"></div>
  </div>

  <!-- Top Bar -->
  <div class="topbar">
    <a class="topbar-brand" href="/">
      <img src="/images/OurProducts/Logo_new.jpeg" alt="BrickBloom" class="topbar-logo" />
      <div class="topbar-text">
        <div class="title">BrickBloom</div>
        <div class="sub">Tax Invoice Portal</div>
      </div>
    </a>

    <!-- Desktop actions -->
    <div class="topbar-actions">
      <button class="tbtn tbtn-auto" onclick="autoFillInvoiceNumber()">✨ Auto #</button>
      <button class="tbtn tbtn-save" onclick="saveInvoice()">💾 Save</button>
      <button class="tbtn tbtn-list" onclick="openDrawer()">📋 Saved (<span id="savedCount">0</span>)</button>
      <button class="tbtn tbtn-img" onclick="saveAsImage()">📷 Image</button>
      <button class="tbtn tbtn-pdf" onclick="saveAsPdf()">📄 PDF</button>
      <button class="tbtn tbtn-reset" onclick="clearForm()">🗑 Reset</button>
      <button class="tbtn tbtn-logout" onclick="logout()">Logout</button>
    </div>

    <!-- Mobile hamburger -->
    <button class="topbar-hamburger" id="hamburger" onclick="toggleMobileMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- Mobile action menu (hidden by default) -->
  <div class="mobile-actions" id="mobileMenu">
    <button class="tbtn tbtn-auto" onclick="autoFillInvoiceNumber();toggleMobileMenu()">✨ Auto Invoice #</button>
    <button class="tbtn tbtn-save" onclick="saveInvoice();toggleMobileMenu()">💾 Save Invoice</button>
    <button class="tbtn tbtn-list" onclick="openDrawer();toggleMobileMenu()">📋 Saved Invoices (<span id="savedCountMobile">0</span>)</button>
    <button class="tbtn tbtn-img" onclick="saveAsImage();toggleMobileMenu()">📷 Save as Image</button>
    <button class="tbtn tbtn-pdf" onclick="saveAsPdf();toggleMobileMenu()">📄 Print / PDF</button>
    <button class="tbtn tbtn-reset" onclick="clearForm();toggleMobileMenu()">🗑 Reset Form</button>
    <button class="tbtn tbtn-logout" onclick="logout()">Logout</button>
  </div>

  <!-- Main Workspace -->
  <div class="workspace">

    <!-- LEFT: Form -->
    <div class="form-col">

      <!-- Editing badge -->
      <div class="editing-badge" id="editingBadge">
        <span>✏️ Editing: <strong id="editingRef"></strong></span>
        <div class="editing-badge-btns">
          <button class="eb-btn eb-new" onclick="duplicateCurrentAsNew()">📋 Save as New</button>
          <button class="eb-btn eb-blank" onclick="clearForm()">✨ Blank</button>
        </div>
      </div>

      <!-- Panel 1: Invoice Details -->
      <div class="panel">
        <div class="panel-head">📋 Invoice Details</div>
        <div class="panel-body">
          <div class="field-grid cols-2">
            <div class="field">
              <label>Invoice / Ref No</label>
              <input type="text" id="refNo" placeholder="BB/26-27/001" oninput="renderPreview()" />
            </div>
            <div class="field">
              <label>Date of Issue</label>
              <input type="date" id="issueDate" oninput="renderPreview()" />
            </div>
          </div>
          <div class="field-grid cols-2" style="margin-top:10px">
            <div class="field">
              <label>Payment Terms</label>
              <input type="text" id="payTerms" placeholder="Immediate / On Receipt" oninput="renderPreview()" />
            </div>
            <div class="field">
              <label>Place of Supply</label>
              <input type="text" id="placeOfSupply" placeholder="Karnataka (29)" oninput="renderPreview()" />
            </div>
          </div>
        </div>
      </div>

      <!-- Panel 2: Customer Details -->
      <div class="panel">
        <div class="panel-head">👤 Bill To (Customer)</div>
        <div class="panel-body">
          <div class="field-grid cols-1">
            <div class="field">
              <label>Customer / Buyer Name</label>
              <input type="text" id="custName" placeholder="Dr. / Mr. / Mrs. / Company Name" oninput="renderPreview()" />
            </div>
          </div>
          <div class="field-grid cols-1" style="margin-top:10px">
            <div class="field">
              <label>Billing Address</label>
              <textarea id="custAddr" rows="2" placeholder="House / Flat, Street, City, State, PIN" oninput="renderPreview()"></textarea>
            </div>
          </div>
          <div class="field-grid cols-2" style="margin-top:10px">
            <div class="field">
              <label>Phone</label>
              <input type="tel" id="custPhone" placeholder="+91 XXXXXXXXXX" oninput="renderPreview()" />
            </div>
            <div class="field">
              <label>State</label>
              <input type="text" id="custState" placeholder="Karnataka" oninput="renderPreview()" />
            </div>
          </div>
          <div class="field-grid cols-1" style="margin-top:10px">
            <div class="field">
              <label>GSTIN / PAN (optional)</label>
              <input type="text" id="custGstin" placeholder="29XXXXX0000X1Z5" oninput="renderPreview()" />
            </div>
          </div>
        </div>
      </div>

      <!-- Panel 3: Line Items -->
      <div class="panel">
        <div class="panel-head">📦 Line Items</div>
        <div class="panel-body">
          <div class="items-scroller">
            <table class="items-tbl">
              <thead>
                <tr>
                  <th style="width:26px;text-align:center">#</th>
                  <th>Description</th>
                  <th style="width:54px;text-align:right">Qty</th>
                  <th style="width:68px;text-align:right">Price ₹</th>
                  <th style="width:72px;text-align:right">Amount</th>
                  <th style="width:26px"></th>
                </tr>
              </thead>
              <tbody id="itemsBody"></tbody>
            </table>
          </div>
          <button class="add-row-btn" id="addRowBtn">+ Add Line Item</button>
        </div>
      </div>

      <!-- Panel 4: Charges & Tax -->
      <div class="panel">
        <div class="panel-head">🧾 Charges &amp; GST</div>
        <div class="panel-body">
          <div class="totals-grid">
            <div class="total-row">
              <label>Items Subtotal</label>
              <span class="tval" id="st_subtotal">₹ 0.00</span>
            </div>
            <div class="total-row">
              <label>Transport / Delivery (₹)</label>
              <input class="num-input" type="number" id="transport" min="0" placeholder="0.00" oninput="renderPreview()" />
            </div>
            <div class="field" style="margin-top:4px">
              <label>GST Tax Rate</label>
              <select class="tax-select" id="taxRate" onchange="renderPreview()">
                <option value="0">Exempted @ 0%</option>
                <option value="5">GST 5% (CGST 2.5% + SGST 2.5%)</option>
                <option value="12">GST 12% (CGST 6% + SGST 6%)</option>
                <option value="18">GST 18% (CGST 9% + SGST 9%)</option>
              </select>
            </div>
            <div class="total-row">
              <label>GST Amount</label>
              <span class="tval" id="st_tax">₹ 0.00</span>
            </div>
            <div class="total-row grand">
              <label>Grand Total</label>
              <span class="tval" id="st_grand">₹ 0.00</span>
            </div>
          </div>
        </div>
      </div>

    </div><!-- /form-col -->

    <!-- RIGHT: Preview + Export -->
    <div class="preview-col">
      <div id="invoiceDoc"><!-- rendered by JS --></div>
      <div class="export-btns">
        <button class="export-btn export-img" onclick="saveAsImage()">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/><path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z"/></svg>
          Export as Image (PNG)
        </button>
        <button class="export-btn export-pdf" onclick="saveAsPdf()">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/><path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2H5zm7 2v3a1 1 0 0 0 1 1h2v3a1 1 0 0 1-1 1h-1v-1a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v1H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12z"/></svg>
          Print / Save as PDF (A4)
        </button>
      </div>
    </div>

  </div><!-- /workspace -->

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    /* ── State ──────────────────────────────────────────────────────────── */
    var items = [];
    var rowCounter = 0;
    var editingId = null;

    /* ── Toast ──────────────────────────────────────────────────────────── */
    function showToast(msg, type) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (type || 'ok');
      clearTimeout(t._timer);
      t._timer = setTimeout(function() { t.className = 'toast'; }, 3200);
    }

    /* ── Mobile menu toggle ─────────────────────────────────────────────── */
    function toggleMobileMenu() {
      document.getElementById('mobileMenu').classList.toggle('open');
    }

    /* ── LocalStorage helpers ───────────────────────────────────────────── */
    var STORE_KEY = 'bb_invoices';

    function loadInvoices() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }
      catch (e) { return []; }
    }

    function storeInvoices(arr) {
      localStorage.setItem(STORE_KEY, JSON.stringify(arr));
      var n = arr.length;
      document.getElementById('savedCount').textContent = n;
      document.getElementById('savedCountMobile').textContent = n;
    }

    /* ── Sync from repo API ─────────────────────────────────────────────── */
    async function syncFromRepo() {
      try {
        var res = await fetch('/api/invoices');
        if (!res.ok) return;
        var repo = await res.json();
        if (!Array.isArray(repo) || !repo.length) return;
        var local = loadInvoices();
        var map = new Map();
        local.forEach(function(i) { map.set(i.id, i); });
        repo.forEach(function(i) { map.set(i.id, i); });
        storeInvoices(Array.from(map.values()));
        renderSavedList();
      } catch (e) {}
    }

    /* ── Get current form data ──────────────────────────────────────────── */
    function getFormData() {
      return {
        id:            editingId || ('INV-' + Date.now()),
        refNo:         v('refNo'),
        issueDate:     v('issueDate'),
        payTerms:      v('payTerms') || 'Immediate',
        placeOfSupply: v('placeOfSupply') || 'Karnataka (29)',
        custName:      v('custName'),
        custAddr:      v('custAddr'),
        custPhone:     v('custPhone'),
        custState:     v('custState'),
        custGstin:     v('custGstin'),
        items:         JSON.parse(JSON.stringify(items)),
        transport:     parseFloat(v('transport') || 0),
        taxRate:       parseFloat(v('taxRate') || 0),
        savedAt:       new Date().toISOString()
      };
    }

    function v(id) { return (document.getElementById(id) || {}).value || ''; }

    /* ── Save invoice ───────────────────────────────────────────────────── */
    async function saveInvoice() {
      var data = getFormData();
      if (!data.refNo) { showToast('❌ Enter a Ref No first', 'err'); return; }
      var all = loadInvoices();
      var idx = all.findIndex(function(i) { return i.id === data.id; });
      if (idx >= 0) { all[idx] = data; showToast('✅ Invoice updated: ' + data.refNo); }
      else          { all.push(data); editingId = data.id; showToast('✅ Invoice saved: ' + data.refNo); }
      storeInvoices(all);
      updateEditingBadge();
      renderSavedList();
      try {
        await fetch('/api/invoices', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch (e) {}
    }

    /* ── Edit invoice ───────────────────────────────────────────────────── */
    function editInvoice(id) {
      var inv = loadInvoices().find(function(i) { return i.id === id; });
      if (!inv) return;
      editingId = inv.id;
      set('refNo',         inv.refNo);
      set('issueDate',     inv.issueDate);
      set('payTerms',      inv.payTerms || 'Immediate');
      set('placeOfSupply', inv.placeOfSupply || 'Karnataka (29)');
      set('custName',      inv.custName);
      set('custAddr',      inv.custAddr);
      set('custPhone',     inv.custPhone);
      set('custState',     inv.custState);
      set('custGstin',     inv.custGstin || '');
      set('transport',     inv.transport || '');
      set('taxRate',       String(inv.taxRate || 0));
      items = inv.items ? JSON.parse(JSON.stringify(inv.items)) : [];
      rowCounter = items.length ? Math.max.apply(null, items.map(function(i) { return i.id || 0; })) : 0;
      rebuildTable();
      updateEditingBadge();
      closeDrawer();
      showToast('✅ Loaded ' + inv.refNo + ' for editing');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function set(id, val) {
      var el = document.getElementById(id);
      if (el) el.value = val || '';
    }

    /* ── Duplicate as new invoice ───────────────────────────────────────── */
    function duplicateInvoice(id) {
      var inv = loadInvoices().find(function(i) { return i.id === id; });
      if (!inv) return;
      editingId = null;
      set('issueDate',     today());
      set('payTerms',      inv.payTerms || 'Immediate');
      set('placeOfSupply', inv.placeOfSupply || 'Karnataka (29)');
      set('custName',      inv.custName);
      set('custAddr',      inv.custAddr);
      set('custPhone',     inv.custPhone);
      set('custState',     inv.custState);
      set('custGstin',     inv.custGstin || '');
      set('transport',     inv.transport || '');
      set('taxRate',       String(inv.taxRate || 0));
      items = inv.items ? JSON.parse(JSON.stringify(inv.items)) : [];
      rowCounter = items.length ? Math.max.apply(null, items.map(function(i) { return i.id || 0; })) : 0;
      rebuildTable();
      autoFillInvoiceNumber();
      updateEditingBadge();
      closeDrawer();
      showToast('✅ Pre-filled from ' + inv.refNo + ' as new invoice');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function duplicateCurrentAsNew() {
      editingId = null;
      autoFillInvoiceNumber();
      updateEditingBadge();
      showToast('✅ Ready as new invoice: ' + v('refNo'));
    }

    /* ── Delete invoice ─────────────────────────────────────────────────── */
    async function deleteInvoice(id) {
      var inv = loadInvoices().find(function(i) { return i.id === id; });
      if (!inv || !confirm('Delete invoice "' + inv.refNo + '"? This cannot be undone.')) return;
      var updated = loadInvoices().filter(function(i) { return i.id !== id; });
      storeInvoices(updated);
      if (editingId === id) { editingId = null; updateEditingBadge(); }
      renderSavedList();
      showToast('✅ Invoice deleted');
      try { await fetch('/api/invoices/' + id, { method: 'DELETE' }); } catch (e) {}
    }

    /* ── Editing badge ──────────────────────────────────────────────────── */
    function updateEditingBadge() {
      var badge = document.getElementById('editingBadge');
      var ref   = document.getElementById('editingRef');
      if (editingId) {
        ref.textContent = v('refNo') || editingId;
        badge.classList.add('visible');
      } else {
        badge.classList.remove('visible');
      }
    }

    /* ── Auto invoice number ────────────────────────────────────────────── */
    function autoFillInvoiceNumber() {
      var d    = new Date();
      var m    = d.getMonth() + 1;
      var y    = d.getFullYear();
      var fys  = m >= 4 ? y : y - 1;
      var pre  = 'BB/' + String(fys).slice(2) + '-' + String(fys + 1).slice(2) + '/';
      var all  = loadInvoices();
      var max  = 0;
      all.forEach(function(inv) {
        if (inv.refNo && inv.refNo.indexOf(pre) === 0) {
          var n = parseInt(inv.refNo.slice(pre.length)) || 0;
          if (n > max) max = n;
        }
      });
      var next = pre + String(max + 1).padStart(3, '0');
      set('refNo', next);
      renderPreview();
      updateEditingBadge();
      showToast('✅ Generated: ' + next);
    }

    /* ── Drawer ─────────────────────────────────────────────────────────── */
    function openDrawer()  {
      renderSavedList();
      document.getElementById('drawer').classList.add('open');
      document.getElementById('drawerOverlay').classList.add('open');
    }
    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('drawerOverlay').classList.remove('open');
    }

    function renderSavedList() {
      var all = loadInvoices().sort(function(a, b) { return new Date(b.savedAt) - new Date(a.savedAt); });
      var el  = document.getElementById('invoicesList');
      storeInvoices(all); // refresh counts

      if (!all.length) {
        el.innerHTML = '<div class="drawer-empty"><div class="drawer-empty-icon">📄</div><div style="font-size:13px;font-weight:700">No saved invoices yet</div><div style="font-size:11px;margin-top:4px">Fill the form and click Save.</div></div>';
        return;
      }

      el.innerHTML = all.map(function(inv) {
        var t = calcFromInv(inv);
        var grand = t.subtotal + t.transport + t.tax;
        return '<div class="inv-saved-card">' +
          '<div class="isc-head">' +
            '<span class="isc-refno">' + escH(inv.refNo || '—') + '</span>' +
            '<span class="isc-date">' + fmtDate(inv.issueDate) + '</span>' +
          '</div>' +
          '<div class="isc-cust">👤 ' + escH(inv.custName || '(no name)') + '</div>' +
          '<div class="isc-total">₹ ' + fmtN(grand) + '</div>' +
          '<div class="isc-actions">' +
            '<button class="isc-btn isc-edit" data-id="' + inv.id + '">✏️ Edit</button>' +
            '<button class="isc-btn isc-clone" data-id="' + inv.id + '">📋 New from this</button>' +
            '<button class="isc-btn isc-del" data-id="' + inv.id + '">🗑 Delete</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    /* Event delegation for drawer buttons */
    document.getElementById('invoicesList').addEventListener('click', function(e) {
      var eb = e.target.closest('.isc-edit');
      if (eb) { editInvoice(eb.dataset.id); return; }
      var cb = e.target.closest('.isc-clone');
      if (cb) { duplicateInvoice(cb.dataset.id); return; }
      var db = e.target.closest('.isc-del');
      if (db) { deleteInvoice(db.dataset.id); return; }
    });

    function calcFromInv(inv) {
      var sub = (inv.items || []).reduce(function(s, r) { return s + parseFloat(r.qty||0) * parseFloat(r.price||0); }, 0);
      var tr  = parseFloat(inv.transport || 0);
      var tax = sub * parseFloat(inv.taxRate || 0) / 100;
      return { subtotal: sub, transport: tr, tax: tax };
    }

    /* ── Row management ─────────────────────────────────────────────────── */
    function addRow(name, qty, price) {
      var id = ++rowCounter;
      items.push({ id: id, name: name || '', qty: qty || '', price: price || '' });
      rebuildTable();
    }

    function removeRow(id) {
      items = items.filter(function(r) { return r.id !== id; });
      if (!items.length) addRow('', '', '');
      else rebuildTable();
    }

    function updateRow(id, field, val) {
      var r = items.find(function(r) { return r.id === id; });
      if (r) { r[field] = val; renderPreview(); }
    }

    function rebuildTable() {
      var tbody = document.getElementById('itemsBody');
      tbody.innerHTML = '';
      items.forEach(function(item, idx) {
        var tr = document.createElement('tr');

        // SR
        var td1 = document.createElement('td');
        td1.textContent = idx + 1;
        td1.style.cssText = 'text-align:center;color:var(--slate-400);font-size:11px;font-weight:700';
        tr.appendChild(td1);

        // Name
        var td2 = document.createElement('td');
        var inp = document.createElement('input');
        inp.type = 'text'; inp.placeholder = 'Item name'; inp.value = item.name || '';
        inp.oninput = (function(iid) { return function() { updateRow(iid, 'name', this.value); }; })(item.id);
        td2.appendChild(inp); tr.appendChild(td2);

        // Qty
        var td3 = document.createElement('td');
        var iq = document.createElement('input');
        iq.type = 'number'; iq.className = 'r'; iq.min = '0'; iq.placeholder = '0';
        iq.value = item.qty || '';
        iq.style.width = '54px';
        iq.oninput = (function(iid) { return function() { updateRow(iid, 'qty', this.value); }; })(item.id);
        td3.appendChild(iq); tr.appendChild(td3);

        // Price
        var td4 = document.createElement('td');
        var ip = document.createElement('input');
        ip.type = 'number'; ip.className = 'r'; ip.min = '0'; ip.step = '0.01'; ip.placeholder = '0.00';
        ip.value = item.price || '';
        ip.style.width = '68px';
        ip.oninput = (function(iid) { return function() { updateRow(iid, 'price', this.value); }; })(item.id);
        td4.appendChild(ip); tr.appendChild(td4);

        // Amount
        var td5 = document.createElement('td');
        td5.style.cssText = 'text-align:right;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums';
        td5.textContent = fmtCur(parseFloat(item.qty || 0) * parseFloat(item.price || 0));
        tr.appendChild(td5);

        // Delete
        var td6 = document.createElement('td');
        var bd = document.createElement('button');
        bd.className = 'row-del'; bd.textContent = '✕'; bd.title = 'Remove';
        bd.onclick = (function(iid) { return function() { removeRow(iid); }; })(item.id);
        td6.appendChild(bd); tr.appendChild(td6);

        tbody.appendChild(tr);
      });
      renderPreview();
    }

    /* ── Calculations ───────────────────────────────────────────────────── */
    function calcTotals() {
      var sub = items.reduce(function(s, r) { return s + parseFloat(r.qty||0) * parseFloat(r.price||0); }, 0);
      var tr  = parseFloat(v('transport') || 0);
      var rate= parseFloat(v('taxRate') || 0);
      var tax = sub * rate / 100;
      return { subtotal: sub, transport: tr, taxRate: rate, tax: tax, grand: sub + tr + tax };
    }

    /* ── Helpers ────────────────────────────────────────────────────────── */
    function fmtN(n) { return isNaN(n) ? '0.00' : n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
    function fmtCur(n) { return isNaN(n) ? '₹ 0.00' : '₹ ' + fmtN(n); }
    function escH(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function fmtDate(d) {
      if (!d) return '';
      var p = d.split('-');
      return p.length === 3 ? p[2]+'-'+p[1]+'-'+p[0] : d;
    }
    function today() { return new Date().toISOString().slice(0,10); }

    /* ── Number to Indian words ─────────────────────────────────────────── */
    function numToWords(n) {
      n = Math.round(n);
      if (n === 0) return 'Zero Rupees Only';
      var a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
      var b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
      function words(num) {
        if (num > 9999999) return 'Crores+';
        if (num > 99999)   return words(Math.floor(num/100000)) + ' Lakh ' + (num%100000 ? words(num%100000) : '');
        if (num > 999)     return words(Math.floor(num/1000)) + ' Thousand ' + (num%1000 ? words(num%1000) : '');
        if (num > 99)      return a[Math.floor(num/100)] + ' Hundred ' + (num%100 ? words(num%100) : '');
        if (num > 19)      return b[Math.floor(num/10)] + (num%10 ? ' ' + a[num%10] : '');
        return a[num];
      }
      return 'Rupees ' + words(n).trim() + ' Only';
    }

    /* ── Export: PDF ────────────────────────────────────────────────────── */
    function saveAsPdf() { window.print(); }

    /* ── Clear form ─────────────────────────────────────────────────────── */
    function clearForm() {
      if (items.length && !confirm('Start a new invoice? Unsaved changes will be lost.')) return;
      ['refNo','custName','custAddr','custPhone','custState','custGstin','transport','payTerms','placeOfSupply'].forEach(function(id) { set(id, ''); });
      set('issueDate', today());
      set('payTerms', 'Immediate');
      set('placeOfSupply', 'Karnataka (29)');
      set('taxRate', '0');
      items = []; rowCounter = 0;
      editingId = null;
      updateEditingBadge();
      addRow('', '', '');
    }

    /* ── Logout ─────────────────────────────────────────────────────────── */
    function logout() {
      sessionStorage.removeItem('bb_admin');
      window.location.href = '/admin';
    }

    /* ── Init ───────────────────────────────────────────────────────────── */
    document.getElementById('addRowBtn').addEventListener('click', function() { addRow('', '', ''); });

    set('issueDate', today());
    set('payTerms', 'Immediate');
    set('placeOfSupply', 'Karnataka (29)');
    storeInvoices(loadInvoices()); // sync count badges
    autoFillInvoiceNumber();
    addRow('', '', '');
    syncFromRepo();
  </script>
</body>
</html>
