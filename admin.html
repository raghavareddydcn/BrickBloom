<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrickBloom Admin Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark: #1a5c2e;
      --green-mid:  #2a8c47;
      --green-light:#3ec467;
      --accent:     #f5a623;
      --glass-bg:   rgba(255,255,255,0.12);
      --glass-border:rgba(255,255,255,0.25);
      --text-light: #ffffff;
      --text-muted: rgba(255,255,255,0.65);
      --error:      #ff6b6b;
    }

    /* ── Background ── */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d3b1e 0%, #1a5c2e 40%, #2a8c47 75%, #1a5c2e 100%);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    @keyframes gradientShift {
      0%  { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100%{ background-position: 0% 50%; }
    }

    /* ── Floating particles ── */
    .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(62,196,103,0.15);
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      width: min(420px, 92vw);
      padding: 48px 40px 40px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 2px 0 rgba(255,255,255,0.1) inset;
      animation: cardIn 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes cardIn {
      from { transform: translateY(40px) scale(0.92); opacity: 0; }
      to   { transform: translateY(0)    scale(1);    opacity: 1; }
    }

    /* ── Logo section ── */
    .logo-wrap {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-logo-img {
      width: 200px;
      height: auto;
      border-radius: 12px;
      object-fit: contain;
      margin-bottom: 10px;
      animation: logoPulse 3s ease-in-out infinite;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.4));
    }
    @keyframes logoPulse {
      0%,100% { filter: drop-shadow(0 4px 16px rgba(0,0,0,0.4)); transform: scale(1); }
      50%      { filter: drop-shadow(0 6px 24px rgba(62,196,103,0.5)); transform: scale(1.03); }
    }

    .brand-name {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-light);
      letter-spacing: 1.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .brand-tagline {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }
    .divider span {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ── Form ── */
    .form-group { margin-bottom: 20px; position: relative; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      transition: color 0.2s;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 16px;
      transition: color 0.3s;
      pointer-events: none;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px 14px 14px 44px;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: var(--text-light);
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
      caret-color: var(--green-light);
    }
    input::placeholder { color: rgba(255,255,255,0.3); }
    input:focus {
      border-color: var(--green-light);
      background: rgba(255,255,255,0.14);
      box-shadow: 0 0 0 3px rgba(62,196,103,0.2);
    }
    input:focus ~ .input-icon,
    .input-wrap:focus-within .input-icon { color: var(--green-light); }

    /* Password toggle */
    .toggle-pw {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 0;
      transition: color 0.2s;
      line-height: 1;
    }
    .toggle-pw:hover { color: var(--text-light); }

    /* ── Error message ── */
    .error-msg {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(255,107,107,0.15);
      border: 1px solid rgba(255,107,107,0.3);
      border-radius: 10px;
      color: var(--error);
      font-size: 13px;
      margin-bottom: 20px;
      animation: shake 0.4s cubic-bezier(0.36,0.07,0.19,0.97);
    }
    .error-msg.visible { display: flex; }
    @keyframes shake {
      10%,90% { transform: translateX(-2px); }
      20%,80% { transform: translateX(4px); }
      30%,50%,70% { transform: translateX(-4px); }
      40%,60% { transform: translateX(4px); }
    }

    /* ── Submit button ── */
    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--green-mid), var(--green-light));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
      box-shadow: 0 4px 20px rgba(62,196,103,0.35);
      position: relative;
      overflow: hidden;
    }
    .btn-login::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(255,255,255,0.15), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(62,196,103,0.5); filter: brightness(1.05); }
    .btn-login:hover::after { opacity: 1; }
    .btn-login:active { transform: translateY(0); }
    .btn-login.loading { pointer-events: none; filter: brightness(0.8); }
    .btn-login .btn-text { transition: opacity 0.2s; }
    .btn-login .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer note ── */
    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── Glow ring around card ── */
    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 25px;
      background: linear-gradient(135deg, rgba(62,196,103,0.4), transparent 60%);
      z-index: -1;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <div class="card">

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="/images/BGLogo.jpeg" alt="BrickBloom" class="brand-logo-img" />
      <div class="brand-tagline">Admin Portal</div>
    </div>

    <div class="divider"><span>Sign in</span></div>

    <!-- Error -->
    <div class="error-msg" id="errorMsg">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 3.5a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0v-3A.75.75 0 0 1 8 4.5zm0 6a.875.875 0 1 1 0-1.75.875.875 0 0 1 0 1.75z"/>
      </svg>
      <span id="errorText">Invalid username or password</span>
    </div>

    <!-- Form -->
    <form id="loginForm" novalidate>

      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2 1H6a4 4 0 0 0-4 4v.5a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5V13a4 4 0 0 0-4-4z"/>
          </svg>
          <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" autofocus />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 1a4 4 0 0 0-4 4v2H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-1V5a4 4 0 0 0-4-4zm-2 6V5a2 2 0 1 1 4 0v2H6zm2 3.5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" />
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
              <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"/>
              <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8zm8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-text">Sign In</span>
        <div class="spinner"></div>
      </button>

    </form>

    <div class="footer-note">BrickBloom &copy; 2026 &nbsp;&bull;&nbsp; Secure Admin Access</div>
  </div>

  <script>
    // ── Particles ─────────────────────────────────────────────────────────────
    (function () {
      const container = document.getElementById('particles');
      const sizes = [40, 60, 80, 100, 120, 150, 200];
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const s = sizes[Math.floor(Math.random() * sizes.length)];
        p.style.cssText = `
          width:${s}px; height:${s}px;
          left:${Math.random() * 100}%;
          animation-duration:${8 + Math.random() * 12}s;
          animation-delay:${-Math.random() * 15}s;
          opacity:${0.04 + Math.random() * 0.08};
        `;
        container.appendChild(p);
      }
    })();

    // ── Password toggle ────────────────────────────────────────────────────────
    document.getElementById('togglePw').addEventListener('click', function () {
      const pw = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.innerHTML = '<path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.512.486l.703.704z"/><path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.943 1.299l.822.823a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.828z"/><path d="M3.35 5.47c-.18.16-.353.322-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709z"/><path fill-rule="evenodd" d="M13.646 14.354l-12-12 .708-.708 12 12-.708.708z"/>';
      } else {
        pw.type = 'password';
        icon.innerHTML = '<path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"/><path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8zm8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/>';
      }
    });

    // ── Login logic ────────────────────────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const btn      = document.getElementById('loginBtn');

      errorMsg.classList.remove('visible');
      btn.classList.add('loading');

      setTimeout(function () {
        btn.classList.remove('loading');
        if (username === 'admin' && password === 'bloomfrompeat') {
          // Store session flag and redirect to invoice page
          sessionStorage.setItem('bb_admin', '1');
          window.location.href = '/invoice';
        } else {
          errorMsg.classList.add('visible');
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      }, 800);
    });
  </script>
</body>
</html>
