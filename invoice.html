<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrickBloom Invoice Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:       #3ec467;
      --brand-dark:  #1a5c2e;
      --sky:         #4fc3f7;
      --sky-dark:    #0288d1;
      --text:        #1a2332;
      --text-muted:  #5a6a7a;
      --border:      #d4e0ea;
      --bg-page:     #eef3f8;
      --bg-card:     #ffffff;
      --red:         #e53935;
      --gold:        #f5a623;
      --shadow-sm:   0 2px 8px rgba(0,0,0,0.06);
      --shadow-md:   0 6px 24px rgba(0,0,0,0.1);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0d3b1e 0%, #1a5c2e 40%, #2a8c47 75%, #1a5c2e 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── Topbar ─────────────────────────────────────────────────── */
    .topbar {
      background: linear-gradient(135deg, var(--brand-dark), #2a8c47);
      color: white;
      padding: 0 16px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .topbar-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .topbar-logo { height: 44px; width: auto; border-radius: 6px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
    .topbar-title { font-size: 16px; font-weight: 700; }
    .topbar-sub   { font-size: 10px; opacity: 0.7; letter-spacing: 1px; }
    .topbar-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

    .btn-sm {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .btn-outline  { background: rgba(255,255,255,0.15); color: white; border: 1.5px solid rgba(255,255,255,0.4); }
    .btn-outline:hover { background: rgba(255,255,255,0.28); }
    .btn-primary  { background: var(--sky); color: white; }
    .btn-primary:hover { background: var(--sky-dark); }
    .btn-success  { background: #4caf50; color: white; }
    .btn-success:hover { background: #388e3c; }
    .btn-danger   { background: var(--red); color: white; }
    .btn-danger:hover { filter: brightness(1.15); }
    .btn-gold     { background: var(--gold); color: #333; }
    .btn-gold:hover { filter: brightness(1.1); }

    /* ─── Saved Invoices Drawer ──────────────────────────────────── */
    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 300;
    }
    .drawer-overlay.open { display: block; }

    .invoices-drawer {
      position: fixed;
      top: 0;
      right: -450px;
      width: min(450px, 95vw);
      height: 100vh;
      background: white;
      box-shadow: -4px 0 32px rgba(0,0,0,0.25);
      z-index: 400;
      transition: right 0.35s cubic-bezier(0.16,1,0.3,1);
      display: flex;
      flex-direction: column;
    }
    .invoices-drawer.open { right: 0; }

    .drawer-head {
      background: linear-gradient(135deg, var(--brand-dark), #2a8c47);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .drawer-head h3 { font-size: 15px; font-weight: 700; }
    .drawer-close {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 30px; height: 30px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .drawer-close:hover { background: rgba(255,255,255,0.35); }

    .drawer-body { flex: 1; overflow-y: auto; padding: 12px; }

    .inv-card {
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .inv-card:hover { border-color: var(--brand); box-shadow: 0 2px 12px rgba(62,196,103,0.15); }
    .inv-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .inv-card-refno { font-size: 13px; font-weight: 700; color: var(--brand-dark); }
    .inv-card-date  { font-size: 11px; color: var(--text-muted); }
    .inv-card-cust  { font-size: 12px; color: var(--text); margin-bottom: 4px; }
    .inv-card-total { font-size: 13px; font-weight: 700; color: var(--sky-dark); }
    .inv-card-actions { display: flex; gap: 6px; margin-top: 10px; }
    .inv-card-actions button { flex: 1; padding: 6px 8px; border-radius: 7px; border: none; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-edit  { background: #e3f2fd; color: var(--sky-dark); }
    .btn-edit:hover { background: var(--sky); color: white; }
    .btn-clone { background: #e8f5e9; color: var(--brand-dark); }
    .btn-clone:hover { background: var(--brand); color: white; }
    .btn-del   { background: #ffebee; color: var(--red); }
    .btn-del:hover { background: var(--red); color: white; }

    .empty-invoices { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-invoices .icon { font-size: 40px; margin-bottom: 12px; }

    /* ─── Layout ─────────────────────────────────────────────────── */
    .workspace {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      padding: 20px;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ─── Panel / Card ───────────────────────────────────────────── */
    .panel { background: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow-sm); overflow: hidden; }
    .panel-head {
      padding: 12px 18px;
      background: linear-gradient(90deg, var(--sky) 0%, var(--sky-dark) 100%);
      color: white; font-size: 12px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-body { padding: 18px; }

    /* ─── Form Fields ─────────────────────────────────────────────── */
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .field-row.single  { grid-template-columns: 1fr; }
    .field label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 4px; }
    .field input, .field textarea, .field select {
      width: 100%; padding: 9px 12px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 13px; color: var(--text); background: #f8fafc;
      transition: border-color 0.2s, box-shadow 0.2s; outline: none; font-family: inherit;
    }
    .field textarea { resize: vertical; min-height: 56px; }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: var(--brand); background: white;
      box-shadow: 0 0 0 3px rgba(62,196,103,0.15);
    }

    /* ─── Items table ─────────────────────────────────────────────── */
    .items-wrap { overflow-x: auto; margin-bottom: 10px; }
    .items-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .items-table th { background: #f1f5f9; padding: 7px 8px; text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); white-space: nowrap; }
    .items-table td { padding: 3px 5px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .items-table input { width: 100%; padding: 6px 7px; border: 1.5px solid var(--border); border-radius: 5px; font-size: 12px; background: white; outline: none; }
    .items-table input:focus { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(62,196,103,0.15); }
    .items-table input.num { text-align: right; }
    .items-table .row-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 15px; padding: 3px 5px; border-radius: 4px; transition: color 0.2s; }
    .items-table .row-del:hover { color: var(--red); background: #fff0f0; }
    .btn-add-row { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1.5px dashed var(--brand); border-radius: 8px; background: rgba(62,196,103,0.05); color: var(--brand-dark); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-add-row:hover { background: rgba(62,196,103,0.12); }

    /* ─── Totals editor ───────────────────────────────────────────── */
    .totals-editor { display: grid; gap: 10px; }
    .totals-editor .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
    .totals-editor .row label { font-weight: 600; color: var(--text-muted); }
    .totals-editor .val { font-weight: 700; color: var(--text); }
    .totals-editor .row.grand { padding-top: 10px; border-top: 2px solid var(--border); }
    .totals-editor .row.grand label { color: var(--brand-dark); font-size: 14px; }
    .totals-editor .row.grand .val { color: var(--brand-dark); font-size: 15px; }
    .totals-editor input[type="number"] {
      padding: 6px 10px; border: 1.5px solid var(--border); border-radius: 7px;
      font-size: 13px; outline: none; background: #f8fafc;
    }
    .totals-editor input:focus { border-color: var(--brand); }

    /* ─── Invoice Wrap ────────────────────────────────────────────── */
    .invoice-wrap {
      position: sticky; top: 76px;
      max-height: calc(100vh - 96px);
      overflow-y: auto;
    }

    /* ─── Preview actions ─────────────────────────────────────────── */
    .preview-actions {
      display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap;
    }
    .btn-print {
      flex: 1; padding: 12px 18px;
      background: linear-gradient(135deg, var(--sky), var(--sky-dark));
      color: white; border: none; border-radius: 10px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s;
    }
    .btn-img {
      flex: 1; padding: 12px 18px;
      background: linear-gradient(135deg, #ff9800, #f57c00);
      color: white; border: none; border-radius: 10px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s;
    }
    .btn-print:hover, .btn-img:hover { transform: translateY(-2px); filter: brightness(1.08); }

    /* ─── Invoice Document Styles ─────────────────────────────────── */
    #invoiceDoc {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      font-size: 13px;
    }
    .inv-amount-header {
      background: linear-gradient(135deg, #1a2332 0%, #2d3f55 100%);
      color: white; padding: 22px 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .inv-amount-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.7; }
    .inv-amount-val { font-size: 26px; font-weight: 800; }

    .inv-seller-row { display: flex; gap: 16px; padding: 20px 24px; border-bottom: 1px solid #f0f0f0; align-items: flex-start; }
    .inv-seller-info { flex: 1; }
    .inv-company-name { font-size: 20px; font-weight: 800; color: var(--brand-dark); margin-bottom: 6px; }
    .inv-addr { font-size: 11.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 6px; }
    .inv-phone, .inv-mail, .inv-web { font-size: 11.5px; color: var(--text-muted); margin-bottom: 2px; }
    .inv-phone a, .inv-mail a, .inv-web a { color: var(--sky-dark); text-decoration: none; }
    .inv-logo-box { width: 120px; flex-shrink: 0; }
    .inv-logo-img { width: 100%; height: auto; border-radius: 8px; object-fit: contain; }

    .inv-bill-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px; border-bottom: 1px solid #f0f0f0; }
    .inv-row-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--brand-dark); margin-bottom: 5px; }
    .inv-row-value { font-size: 12.5px; color: var(--text); line-height: 1.6; }
    .inv-row-value .phone { color: var(--sky-dark); }

    .inv-items-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .inv-items-table th { background: #f7f9fc; padding: 10px 12px; text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); border-bottom: 2px solid #eee; }
    .inv-items-table td { padding: 10px 12px; border-bottom: 1px solid #f3f3f3; vertical-align: middle; }
    .inv-items-table tr:last-child td { border-bottom: none; }
    .inv-items-table .tax-row td { padding: 4px 12px; font-size: 11px; color: var(--text-muted); background: #fafbfc; }
    .inv-items-table .subtotal-row td { background: #f7f9fc; font-weight: 600; font-size: 12.5px; border-top: 2px solid #eee; }

    .inv-totals { padding: 14px 24px; border-top: 2px solid #eee; }
    .inv-total-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 12.5px; }
    .inv-total-row.grand { font-size: 15px; font-weight: 800; color: var(--brand-dark); padding-top: 10px; border-top: 2px solid var(--brand-dark); margin-top: 5px; }
    .inv-total-row .lbl { color: var(--text-muted); }
    .inv-total-row .amt { font-weight: 600; color: var(--text); }
    .inv-total-row.grand .amt { color: var(--brand-dark); }

    .inv-tax-section { padding: 12px 24px; background: #f7f9fc; border-top: 1px solid #eee; }
    .inv-tax-title { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .inv-tax-row { display: flex; justify-content: space-between; font-size: 12px; }
    .inv-tax-row .lbl { color: var(--text-muted); }
    .inv-tax-row .amt { font-weight: 600; }

    .inv-footer { padding: 14px 24px; text-align: center; font-size: 10.5px; color: var(--text-muted); border-top: 1px dashed #ddd; }

    /* ─── Editing indicator ───────────────────────────────────────── */
    .editing-badge {
      display: none;
      background: #fff3e0;
      border: 1.5px solid #ff9800;
      color: #e65100;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .editing-badge.visible { display: flex; }

    /* ─── Toast ───────────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #1a2332; color: white;
      padding: 12px 20px; border-radius: 10px;
      font-size: 13px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      transform: translateY(80px); opacity: 0;
      transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
      z-index: 1000; display: flex; align-items: center; gap: 8px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: var(--brand-dark); }
    .toast.error   { background: var(--red); }

    /* ─── Print styles ───────────────────────────────────────────── */
    @media print {
      body { background: white !important; }
      .topbar, .form-col, .preview-actions, .editing-badge { display: none !important; }
      .workspace { grid-template-columns: 1fr; padding: 0; }
      .invoice-wrap { position: static; max-height: none; overflow: visible; }
      #invoiceDoc { box-shadow: none; border-radius: 0; }
    }

    /* ─── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
      .invoice-wrap { position: static; max-height: none; }
    }
  </style>
</head>
<body>

  <!-- Auth guard -->
  <script>
    if (!sessionStorage.getItem('bb_admin')) {
      window.location.replace('/admin');
    }
  </script>

  <!-- Drawer overlay -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

  <!-- Saved Invoices Drawer -->
  <div class="invoices-drawer" id="invoicesDrawer">
    <div class="drawer-head">
      <div>
        <h3>📋 Saved Invoices</h3>
        <div style="font-size:10px;opacity:0.8;font-weight:400;margin-top:2px">Saved to repo folder: invoices/</div>
      </div>
      <button class="drawer-close" onclick="closeDrawer()">×</button>
    </div>
    <div class="drawer-body" id="invoicesList"></div>
  </div>

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-brand">
      <img src="/images/OurProducts/Logo_new.jpeg" alt="BrickBloom" class="topbar-logo" />
      <div>
        <div class="topbar-title">BrickBloom</div>
        <div class="topbar-sub">Invoice Generator</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn-sm btn-gold" onclick="autoFillInvoiceNumber()" title="Auto-generate next invoice number">
        # Auto
      </button>
      <button class="btn-sm btn-success" onclick="saveInvoice()" title="Save / Update invoice">
        💾 Save
      </button>
      <button class="btn-sm btn-outline" id="savedCountBtn" onclick="openDrawer()">
        📋 Saved (<span id="savedCount">0</span>)
      </button>
      <button class="btn-sm btn-outline" onclick="saveAsImage()">
        📷 Image
      </button>
      <button class="btn-sm btn-primary" onclick="saveAsPdf()">
        📄 PDF
      </button>
      <button class="btn-sm btn-outline" onclick="clearForm()">
        🗑 Clear
      </button>
      <button class="btn-sm btn-danger" onclick="logout()">
        Logout
      </button>
    </div>
  </div>

  <div class="workspace">

    <!-- ── Left: Form ───────────────────────────────────────────── -->
    <div class="form-col">

      <!-- Editing indicator -->
      <div class="editing-badge" id="editingBadge">
        <span>✏️ Editing Invoice: <strong id="editingRef"></strong></span>
        <div style="display:flex;gap:6px">
          <button onclick="duplicateCurrentAsNew()" style="background:#2e7d32;color:white;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:11px;font-weight:600">📋 Save as New</button>
          <button onclick="clearForm()" style="background:#ff9800;color:white;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:11px">✨ Blank Form</button>
        </div>
      </div>

      <!-- Invoice Meta -->
      <div class="panel" style="margin-bottom:14px;">
        <div class="panel-head">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M14.5 3a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h13zm-13-1A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-13z"/></svg>
          Invoice Details
        </div>
        <div class="panel-body">
          <div class="field-row">
            <div class="field">
              <label>Ref No</label>
              <input type="text" id="refNo" placeholder="BB/26-27/001" oninput="renderPreview()" />
            </div>
            <div class="field">
              <label>Date of Issue</label>
              <input type="date" id="issueDate" oninput="renderPreview()" />
            </div>
          </div>
        </div>
      </div>

      <!-- Bill To -->
      <div class="panel" style="margin-bottom:14px;">
        <div class="panel-head">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2 1H6a4 4 0 0 0-4 4v.5a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5V13a4 4 0 0 0-4-4z"/></svg>
          Bill To (Customer)
        </div>
        <div class="panel-body">
          <div class="field-row single">
            <div class="field">
              <label>Customer Name</label>
              <input type="text" id="custName" placeholder="Mr. / Mrs. ..." oninput="renderPreview()" />
            </div>
          </div>
          <div class="field-row single">
            <div class="field">
              <label>Address</label>
              <textarea id="custAddr" rows="2" placeholder="Street, City, State, PIN" oninput="renderPreview()"></textarea>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Phone</label>
              <input type="tel" id="custPhone" placeholder="+91 XXXXXXXXXX" oninput="renderPreview()" />
            </div>
            <div class="field">
              <label>State</label>
              <input type="text" id="custState" placeholder="Karnataka" oninput="renderPreview()" />
            </div>
          </div>
        </div>
      </div>

      <!-- Line Items -->
      <div class="panel" style="margin-bottom:14px;">
        <div class="panel-head">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.777.416L8 13.101l-5.223 2.815A.5.5 0 0 1 2 15.5V2zm2-1a1 1 0 0 0-1 1v12.566l4.723-2.482a.5.5 0 0 1 .554 0L13 14.566V2a1 1 0 0 0-1-1H4z"/></svg>
          Line Items
        </div>
        <div class="panel-body">
          <div class="items-wrap">
            <table class="items-table">
              <thead>
                <tr>
                  <th style="width:32px">#</th>
                  <th>Item Name</th>
                  <th style="width:58px">Qty</th>
                  <th style="width:70px">Price</th>
                  <th style="width:78px">Amount</th>
                  <th style="width:30px"></th>
                </tr>
              </thead>
              <tbody id="itemsBody"></tbody>
            </table>
          </div>
          <button class="btn-add-row" id="btnAddRowBtn">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/></svg>
            Add Item
          </button>
        </div>
      </div>

      <!-- Charges & Tax -->
      <div class="panel">
        <div class="panel-head">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M1 3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1H1zm7 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/><path d="M0 5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V5zm3 0a2 2 0 0 1-2 2v4a2 2 0 0 1 2 2h10a2 2 0 0 1 2-2V7a2 2 0 0 1-2-2H3z"/></svg>
          Charges &amp; Tax
        </div>
        <div class="panel-body">
          <div class="totals-editor">
            <div class="row"><label>Items Sub-total</label><span class="val" id="st_subtotal">₹ 0.00</span></div>
            <div class="row">
              <label>Transport Charges</label>
              <input type="number" id="transport" min="0" placeholder="0" oninput="renderPreview()" style="width:100px" />
            </div>
            <div class="row">
              <label>Tax</label>
              <select id="taxRate" onchange="renderPreview()" style="width:140px;padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;">
                <option value="0">Exempted @ 0%</option>
                <option value="5">GST 5%</option>
                <option value="12">GST 12%</option>
                <option value="18">GST 18%</option>
              </select>
            </div>
            <div class="row"><label>Tax Amount</label><span class="val" id="st_tax">₹ 0.00</span></div>
            <div class="row grand"><label>Grand Total</label><span class="val" id="st_grand">₹ 0.00</span></div>
          </div>
        </div>
      </div>

    </div><!-- /form-col -->

    <!-- ── Right: Preview ──────────────────────────────────────────── -->
    <div class="invoice-wrap">
      <div id="invoiceDoc"><!-- Rendered by JS --></div>
      <div class="preview-actions">
        <button class="btn-img" onclick="saveAsImage()">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/><path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z"/></svg>
          Save as Image
        </button>
        <button class="btn-print" onclick="saveAsPdf()">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/><path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2H5zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4V3zm1 5a2 2 0 0 0-2 2v1H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v-1a2 2 0 0 0-2-2H5zm7 2v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1z"/></svg>
          Save as PDF
        </button>
      </div>
    </div>

  </div><!-- /workspace -->

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script>
    // ─── State ────────────────────────────────────────────────────────────────
    var items = [];
    var rowCounter = 0;
    var editingId = null;

    // ─── Toast ────────────────────────────────────────────────────────────────
    function showToast(msg, type) {
      if (!type) type = 'success';
      var t = document.getElementById('toast');
      t.textContent = (type === 'success' ? '✅ ' : type === 'error' ? '❌ ' : 'ℹ️ ') + msg;
      t.className = 'toast show ' + type;
      setTimeout(function() { t.className = 'toast'; }, 3200);
    }

    // ─── Storage Helpers (LocalStorage + Repo API Sync) ────────────────────────
    var STORAGE_KEY = 'bb_invoices';

    function loadInvoices() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch (e) { return []; }
    }

    function storeInvoices(arr) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
      document.getElementById('savedCount').textContent = arr.length;
    }

    // Fetch invoices from repo API on load
    async function syncFromRepo() {
      try {
        var res = await fetch('/api/invoices');
        if (res.ok) {
          var repoInvoices = await res.json();
          if (Array.isArray(repoInvoices) && repoInvoices.length > 0) {
            var local = loadInvoices();
            var map = new Map();
            local.forEach(function(i) { map.set(i.id, i); });
            repoInvoices.forEach(function(i) { map.set(i.id, i); });
            var merged = Array.from(map.values());
            storeInvoices(merged);
            renderSavedList();
          }
        }
      } catch (e) {
        // Fallback to localStorage
      }
    }

    function getInvoiceData() {
      return {
        id: editingId || ('INV-' + Date.now()),
        refNo:    document.getElementById('refNo').value.trim() || '',
        issueDate:document.getElementById('issueDate').value || '',
        custName: document.getElementById('custName').value.trim() || '',
        custAddr: document.getElementById('custAddr').value.trim() || '',
        custPhone:document.getElementById('custPhone').value.trim() || '',
        custState:document.getElementById('custState').value.trim() || '',
        items:    JSON.parse(JSON.stringify(items)),
        transport:parseFloat(document.getElementById('transport').value || 0),
        taxRate:  parseFloat(document.getElementById('taxRate').value || 0),
        savedAt:  new Date().toISOString()
      };
    }

    async function saveInvoice() {
      var data = getInvoiceData();
      if (!data.refNo) {
        showToast('Please enter a Ref No before saving', 'error');
        return;
      }
      var all = loadInvoices();
      var idx = all.findIndex(function(i) { return i.id === data.id; });
      if (idx >= 0) {
        all[idx] = data;
        showToast('Invoice updated: ' + data.refNo);
      } else {
        all.push(data);
        editingId = data.id;
        showToast('Invoice saved: ' + data.refNo);
      }
      storeInvoices(all);
      updateEditingBadge();
      renderSavedList();

      try {
        await fetch('/api/invoices', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch (e) {}
    }

    function editInvoice(id) {
      var all = loadInvoices();
      var inv = all.find(function(i) { return i.id === id; });
      if (!inv) return;

      editingId = inv.id;
      document.getElementById('refNo').value     = inv.refNo || '';
      document.getElementById('issueDate').value = inv.issueDate || '';
      document.getElementById('custName').value  = inv.custName || '';
      document.getElementById('custAddr').value  = inv.custAddr || '';
      document.getElementById('custPhone').value = inv.custPhone || '';
      document.getElementById('custState').value = inv.custState || '';
      document.getElementById('transport').value = inv.transport || '';
      document.getElementById('taxRate').value   = String(inv.taxRate || 0);

      items = inv.items ? JSON.parse(JSON.stringify(inv.items)) : [];
      rowCounter = items.length > 0 ? Math.max.apply(null, items.map(function(i) { return i.id || 0; })) : 0;

      rebuildTable();
      updateEditingBadge();
      closeDrawer();
      showToast('Loaded details of ' + inv.refNo + ' for editing');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function duplicateInvoice(id) {
      var all = loadInvoices();
      var inv = all.find(function(i) { return i.id === id; });
      if (!inv) return;

      // Pre-fill all details but clear editingId so saving creates a NEW invoice
      editingId = null;
      document.getElementById('issueDate').value = today();
      document.getElementById('custName').value  = inv.custName || '';
      document.getElementById('custAddr').value  = inv.custAddr || '';
      document.getElementById('custPhone').value = inv.custPhone || '';
      document.getElementById('custState').value = inv.custState || '';
      document.getElementById('transport').value = inv.transport || '';
      document.getElementById('taxRate').value   = String(inv.taxRate || 0);

      items = inv.items ? JSON.parse(JSON.stringify(inv.items)) : [];
      rowCounter = items.length > 0 ? Math.max.apply(null, items.map(function(i) { return i.id || 0; })) : 0;

      rebuildTable();
      autoFillInvoiceNumber(); // Auto-generates next serial invoice number
      updateEditingBadge();
      closeDrawer();
      showToast('Pre-filled all details from ' + inv.refNo + ' for NEW invoice ' + document.getElementById('refNo').value);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function duplicateCurrentAsNew() {
      editingId = null;
      autoFillInvoiceNumber();
      updateEditingBadge();
      showToast('Pre-filled details ready as NEW invoice: ' + document.getElementById('refNo').value);
    }

    async function deleteInvoice(id) {
      var all = loadInvoices();
      var inv = all.find(function(i) { return i.id === id; });
      if (!inv) return;
      if (!confirm('Delete invoice "' + inv.refNo + '"? This cannot be undone.')) return;
      var updated = all.filter(function(i) { return i.id !== id; });
      storeInvoices(updated);
      if (editingId === id) { editingId = null; updateEditingBadge(); }
      renderSavedList();
      showToast('Invoice deleted');

      try {
        await fetch('/api/invoices/' + id, { method: 'DELETE' });
      } catch (e) {}
    }

    function updateEditingBadge() {
      var badge = document.getElementById('editingBadge');
      var ref   = document.getElementById('editingRef');
      if (editingId) {
        ref.textContent = document.getElementById('refNo').value || editingId;
        badge.classList.add('visible');
      } else {
        badge.classList.remove('visible');
      }
    }

    // ─── Auto Invoice Number Generator ─────────────────────────────────────────
    function autoFillInvoiceNumber() {
      var now     = new Date();
      var year    = now.getFullYear();
      var month   = now.getMonth() + 1;
      var fyStart = month >= 4 ? year : year - 1;
      var fyEnd   = fyStart + 1;
      var fyShort = String(fyStart).slice(2) + '-' + String(fyEnd).slice(2);
      var prefix  = 'BB/' + fyShort + '/';

      var all = loadInvoices();
      var maxSerial = 0;
      all.forEach(function(inv) {
        if (inv.refNo && inv.refNo.indexOf(prefix) === 0) {
          var n = parseInt(inv.refNo.slice(prefix.length)) || 0;
          if (n > maxSerial) maxSerial = n;
        }
      });

      var next = String(maxSerial + 1).padStart(3, '0');
      document.getElementById('refNo').value = prefix + next;
      renderPreview();
      updateEditingBadge();
      showToast('Generated Ref: ' + prefix + next);
    }

    // ─── Drawer ───────────────────────────────────────────────────────────────
    function openDrawer() {
      renderSavedList();
      document.getElementById('invoicesDrawer').classList.add('open');
      document.getElementById('drawerOverlay').classList.add('open');
    }
    function closeDrawer() {
      document.getElementById('invoicesDrawer').classList.remove('open');
      document.getElementById('drawerOverlay').classList.remove('open');
    }

    function renderSavedList() {
      var all = loadInvoices().sort(function(a, b) { return new Date(b.savedAt) - new Date(a.savedAt); });
      var el  = document.getElementById('invoicesList');
      document.getElementById('savedCount').textContent = all.length;

      if (!all.length) {
        el.innerHTML = '<div class="empty-invoices"><div class="icon">📄</div><div>No saved invoices yet.</div><div style="font-size:11px;margin-top:6px">Save an invoice to see it here.</div></div>';
        return;
      }

      el.innerHTML = all.map(function(inv) {
        var t = calcTotalsFromInv(inv);
        var grand = t.subtotal + t.transport + t.taxAmount;
        return '<div class="inv-card" id="card-' + inv.id + '">' +
          '<div class="inv-card-head">' +
            '<span class="inv-card-refno">' + escHtml(inv.refNo || '—') + '</span>' +
            '<span class="inv-card-date">' + formatDate(inv.issueDate) + '</span>' +
          '</div>' +
          '<div class="inv-card-cust">👤 ' + escHtml(inv.custName || 'No customer name') + '</div>' +
          '<div class="inv-card-total">₹ ' + grand.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '</div>' +
          '<div class="inv-card-actions">' +
            '<button class="btn-edit" data-id="' + inv.id + '" title="Edit existing invoice">✏️ Edit</button>' +
            '<button class="btn-clone" data-id="' + inv.id + '" title="Pre-fill details as new invoice">📋 New from this</button>' +
            '<button class="btn-del" data-id="' + inv.id + '" title="Delete invoice">🗑 Delete</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    // Attach event delegation for drawer action buttons
    document.getElementById('invoicesList').addEventListener('click', function(e) {
      var editBtn = e.target.closest('.btn-edit');
      if (editBtn) {
        editInvoice(editBtn.getAttribute('data-id'));
        return;
      }
      var cloneBtn = e.target.closest('.btn-clone');
      if (cloneBtn) {
        duplicateInvoice(cloneBtn.getAttribute('data-id'));
        return;
      }
      var delBtn = e.target.closest('.btn-del');
      if (delBtn) {
        deleteInvoice(delBtn.getAttribute('data-id'));
        return;
      }
    });

    function calcTotalsFromInv(inv) {
      var subtotal  = (inv.items || []).reduce(function(s, r) { return s + parseFloat(r.qty || 0) * parseFloat(r.price || 0); }, 0);
      var transport = parseFloat(inv.transport || 0);
      var taxAmount = subtotal * parseFloat(inv.taxRate || 0) / 100;
      return { subtotal: subtotal, transport: transport, taxAmount: taxAmount };
    }

    // ─── Row Management (DOM-based, Robust & Quote-Safe) ────────────────────────
    function addRow(name, qty, price) {
      var id = ++rowCounter;
      items.push({ id: id, name: name || '', qty: qty || '', price: price || '' });
      rebuildTable();
    }

    function removeRow(id) {
      items = items.filter(function(r) { return r.id !== id; });
      if (items.length === 0) {
        addRow('', '', '');
      } else {
        rebuildTable();
      }
    }

    function updateRow(id, field, value) {
      var r = items.find(function(r) { return r.id === id; });
      if (r) { r[field] = value; renderPreview(); }
    }

    function rebuildTable() {
      var tbody = document.getElementById('itemsBody');
      tbody.innerHTML = '';
      items.forEach(function(item, idx) {
        var tr = document.createElement('tr');

        // SR No
        var tdIdx = document.createElement('td');
        tdIdx.style.cssText = 'color:var(--text-muted);font-size:11px;text-align:center';
        tdIdx.textContent = String(idx + 1);
        tr.appendChild(tdIdx);

        // Item Name Input
        var tdName = document.createElement('td');
        var inputName = document.createElement('input');
        inputName.type = 'text';
        inputName.placeholder = 'Item name';
        inputName.value = item.name || '';
        inputName.oninput = function() { updateRow(item.id, 'name', this.value); };
        tdName.appendChild(inputName);
        tr.appendChild(tdName);

        // Qty Input
        var tdQty = document.createElement('td');
        var inputQty = document.createElement('input');
        inputQty.type = 'number';
        inputQty.className = 'num';
        inputQty.placeholder = '0';
        inputQty.value = item.qty || '';
        inputQty.min = '0';
        inputQty.style.width = '58px';
        inputQty.oninput = function() { updateRow(item.id, 'qty', this.value); };
        tdQty.appendChild(inputQty);
        tr.appendChild(tdQty);

        // Price Input
        var tdPrice = document.createElement('td');
        var inputPrice = document.createElement('input');
        inputPrice.type = 'number';
        inputPrice.className = 'num';
        inputPrice.placeholder = '0.00';
        inputPrice.value = item.price || '';
        inputPrice.min = '0';
        inputPrice.step = '0.01';
        inputPrice.oninput = function() { updateRow(item.id, 'price', this.value); };
        tdPrice.appendChild(inputPrice);
        tr.appendChild(tdPrice);

        // Amount Display
        var tdAmt = document.createElement('td');
        tdAmt.style.cssText = 'text-align:right;font-weight:600;font-size:12px;color:var(--text)';
        var amount = parseFloat(item.qty || 0) * parseFloat(item.price || 0);
        tdAmt.textContent = fmt(amount);
        tr.appendChild(tdAmt);

        // Delete Row Button
        var tdDel = document.createElement('td');
        var btnDel = document.createElement('button');
        btnDel.className = 'row-del';
        btnDel.textContent = '✕';
        btnDel.title = 'Remove';
        btnDel.onclick = function() { removeRow(item.id); };
        tdDel.appendChild(btnDel);
        tr.appendChild(tdDel);

        tbody.appendChild(tr);
      });
      renderPreview();
    }

    // ─── Calculations ─────────────────────────────────────────────────────────
    function calcTotals() {
      var subtotal  = items.reduce(function(s, r) { return s + parseFloat(r.qty || 0) * parseFloat(r.price || 0); }, 0);
      var transport = parseFloat(document.getElementById('transport').value || 0);
      var taxRate   = parseFloat(document.getElementById('taxRate').value || 0);
      var taxAmount = subtotal * taxRate / 100;
      var grand     = subtotal + transport + taxAmount;
      return { subtotal: subtotal, transport: transport, taxRate: taxRate, taxAmount: taxAmount, grand: grand };
    }

    // ─── Helpers ──────────────────────────────────────────────────────────────
    function fmt(n) {
      if (isNaN(n)) return '₹ 0.00';
      return '₹ ' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }
    function fmtP(n) {
      if (isNaN(n)) return '0.00';
      return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }
    function esc(v)     { return String(v || '').replace(/"/g, '&quot;'); }
    function escHtml(v) { return String(v || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function formatDate(d) {
      if (!d) return '';
      var parts = d.split('-');
      return parts[2] + '-' + parts[1] + '-' + parts[0];
    }
    function today() { return new Date().toISOString().split('T')[0]; }

    // ─── Render Preview ───────────────────────────────────────────────────────
    function renderPreview() {
      var t = calcTotals();
      document.getElementById('st_subtotal').textContent = fmt(t.subtotal);
      document.getElementById('st_tax').textContent      = fmt(t.taxAmount);
      document.getElementById('st_grand').textContent    = fmt(t.grand);

      var totalQty = items.reduce(function(s, r) { return s + parseFloat(r.qty || 0); }, 0);
      var itemRows = items.map(function(r, idx) {
        var amt = parseFloat(r.qty || 0) * parseFloat(r.price || 0);
        return '<tr>' +
            '<td>' + (idx + 1) + '</td>' +
            '<td>' + escHtml(r.name || '—') + '</td>' +
            '<td style="text-align:right">' + escHtml(r.qty) + '</td>' +
            '<td style="text-align:right">' + fmtP(parseFloat(r.price || 0)) + '</td>' +
            '<td style="text-align:right">' + fmtP(amt) + '</td>' +
          '</tr>' +
          '<tr class="tax-row">' +
            '<td colspan="3" style="text-align:right;padding-right:12px">Tax: ' + (t.taxRate === 0 ? 'Exempted :' : t.taxRate + '% :') + '</td>' +
            '<td colspan="2" style="text-align:right">' + fmtP(t.taxRate === 0 ? 0 : amt * t.taxRate / 100) + '</td>' +
          '</tr>';
      }).join('');

      var refNo     = escHtml(document.getElementById('refNo').value     || 'BB/26-27/—');
      var issueDate = escHtml(formatDate(document.getElementById('issueDate').value));
      var custName  = escHtml(document.getElementById('custName').value);
      var custAddr  = escHtml(document.getElementById('custAddr').value).replace(/\n/g, '<br>');
      var custPhone = escHtml(document.getElementById('custPhone').value);
      var custState = escHtml(document.getElementById('custState').value);

      document.getElementById('invoiceDoc').innerHTML =
        '<div class="inv-amount-header">' +
          '<div><div class="inv-amount-label">Amount due</div></div>' +
          '<div class="inv-amount-val">₹ ' + t.grand.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '</div>' +
        '</div>' +
        '<div class="inv-seller-row">' +
          '<div class="inv-seller-info">' +
            '<div class="inv-company-name">BrickBloom</div>' +
            '<div class="inv-addr">No 12, Ground Floor, AVP Complex,<br>Sy No 97, Dommasandra Village,<br>Virgo Nagar Post, Bangalore 560049</div>' +
            '<div class="inv-phone"><a href="tel:+918951744898">📞 +91 8951744898</a></div>' +
            '<div class="inv-mail"><a href="mailto:info@brickbloom.co.in">✉ info@brickbloom.co.in</a></div>' +
            '<div class="inv-web"><a href="https://www.brickbloom.co.in">🌐 www.brickbloom.co.in</a></div>' +
          '</div>' +
          '<div class="inv-logo-box">' +
            '<img src="/images/OurProducts/Logo_new.jpeg" alt="BrickBloom" class="inv-logo-img" />' +
          '</div>' +
        '</div>' +
        '<div class="inv-bill-row">' +
          '<div class="inv-bill-col">' +
            '<div class="inv-row-label">Bill To:</div>' +
            '<div class="inv-row-value">' +
              '<strong>' + (custName || 'Customer Name') + '</strong><br>' +
              (custAddr || '—') + '<br>' +
              (custPhone ? '<span class="phone">' + custPhone + '</span><br>' : '') +
              (custState || '') +
            '</div>' +
          '</div>' +
          '<div class="inv-ref-col">' +
            '<div class="inv-row-label" style="color:var(--text-muted)">Ref No:</div>' +
            '<div class="inv-row-value" style="color:var(--sky-dark);font-weight:700">' + refNo + '</div>' +
            '<div style="margin-top:8px">' +
              '<div class="inv-row-label" style="color:var(--sky-dark)">Date of Issue</div>' +
              '<div class="inv-row-value">' + (issueDate || '—') + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<table class="inv-items-table">' +
          '<thead>' +
            '<tr>' +
              '<th style="width:30px">SR</th>' +
              '<th>Name</th>' +
              '<th style="text-align:right">Qty</th>' +
              '<th style="text-align:right">Price</th>' +
              '<th style="text-align:right">Amount</th>' +
            '</tr>' +
          '</thead>' +
          '<tbody>' +
            (itemRows || '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:16px">No items added</td></tr>') +
            '<tr class="subtotal-row">' +
              '<td colspan="2"><strong>Total</strong></td>' +
              '<td style="text-align:right">' + totalQty + '</td>' +
              '<td></td>' +
              '<td style="text-align:right">' + fmtP(t.subtotal) + '</td>' +
            '</tr>' +
          '</tbody>' +
        '</table>' +
        '<div class="inv-totals">' +
          '<div class="inv-total-row"><span class="lbl">Transport charges</span><span class="amt">' + fmtP(t.transport) + '</span></div>' +
          '<div class="inv-total-row grand"><span class="lbl">Grand Total</span><span class="amt">₹ ' + fmtP(t.grand) + '</span></div>' +
          '<div class="inv-total-row"><span class="lbl">Balance</span><span class="amt">₹ ' + fmtP(t.grand) + '</span></div>' +
        '</div>' +
        '<div class="inv-tax-section">' +
          '<div class="inv-tax-title">Tax Details</div>' +
          '<div class="inv-tax-row">' +
            '<span class="lbl">' + (t.taxRate === 0 ? 'EXEMPTED @ 0%' : 'GST @ ' + t.taxRate + '%') + '</span>' +
            '<span class="amt">' + fmtP(t.taxAmount) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="inv-footer">' +
          'Thank you for your business! &nbsp;|&nbsp; BrickBloom — From Nature, For Nature' +
        '</div>';
    }

    // ─── Save as Image ────────────────────────────────────────────────────────
    function saveAsImage() {
      var el  = document.getElementById('invoiceDoc');
      var ref = document.getElementById('refNo').value.trim().replace(/\//g, '-') || 'invoice';
      showToast('Generating image…', 'info');
      html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#ffffff' })
        .then(function(canvas) {
          var link = document.createElement('a');
          link.download = 'BrickBloom-' + ref + '.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
          showToast('Image saved: ' + link.download);
        })
        .catch(function() { showToast('Image export failed', 'error'); });
    }

    // ─── Save as PDF ──────────────────────────────────────────────────────────
    function saveAsPdf() {
      window.print();
    }

    // ─── Clear Form ───────────────────────────────────────────────────────────
    function clearForm() {
      if (items.length > 0 || document.getElementById('custName').value) {
        if (!confirm('Start a new invoice? Unsaved changes will be lost.')) return;
      }
      ['refNo','custName','custAddr','custPhone','custState','transport'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.getElementById('issueDate').value = today();
      document.getElementById('taxRate').value   = '0';
      items = []; rowCounter = 0;
      editingId = null;
      updateEditingBadge();
      addRow('', '', '');
    }

    // ─── Logout ───────────────────────────────────────────────────────────────
    function logout() {
      sessionStorage.removeItem('bb_admin');
      window.location.href = '/admin';
    }

    // ─── Init ─────────────────────────────────────────────────────────────────
    document.getElementById('btnAddRowBtn').addEventListener('click', function() {
      addRow('', '', '');
    });

    document.getElementById('issueDate').value = today();
    var allInv = loadInvoices();
    document.getElementById('savedCount').textContent = allInv.length;
    autoFillInvoiceNumber();
    addRow('', '', '');
    syncFromRepo();

  </script>
</body>
</html>
