<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrickBloom Invoice Generator</title>
  <style>
    /* ─── Reset & Base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:       #3ec467;
      --brand-dark:  #1a5c2e;
      --sky:         #4fc3f7;
      --sky-dark:    #0288d1;
      --text:        #1a2332;
      --text-muted:  #5a6a7a;
      --border:      #d4e0ea;
      --bg-page:     #eef3f8;
      --bg-card:     #ffffff;
      --red:         #e53935;
      --shadow-sm:   0 2px 8px rgba(0,0,0,0.06);
      --shadow-md:   0 6px 24px rgba(0,0,0,0.1);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-page);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── Top bar ──────────────────────────────────────────────────────── */
    .topbar {
      background: linear-gradient(135deg, var(--brand-dark), #2a8c47);
      color: white;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-brand { display: flex; align-items: center; gap: 12px; }
    .topbar-leaf {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      flex-shrink: 0;
    }
    .topbar-title { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
    .topbar-sub   { font-size: 11px; opacity: 0.7; letter-spacing: 1px; }
    .topbar-actions { display: flex; gap: 8px; }
    .btn-sm {
      padding: 7px 16px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-outline {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1.5px solid rgba(255,255,255,0.4);
    }
    .btn-outline:hover { background: rgba(255,255,255,0.25); }
    .btn-primary { background: var(--sky); color: white; }
    .btn-primary:hover { background: var(--sky-dark); transform: translateY(-1px); }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover { filter: brightness(1.1); }

    /* ─── Layout ───────────────────────────────────────────────────────── */
    .workspace {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ─── Panel / Card ─────────────────────────────────────────────────── */
    .panel {
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .panel-head {
      padding: 14px 20px;
      background: linear-gradient(90deg, var(--sky) 0%, var(--sky-dark) 100%);
      color: white;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-body { padding: 20px; }

    /* ─── Form Fields ──────────────────────────────────────────────────── */
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .field-row.single { grid-template-columns: 1fr; }
    .field-row.triple { grid-template-columns: 1fr 1fr 1fr; }

    .field label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .field input, .field textarea, .field select {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text);
      background: #f8fafc;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      font-family: inherit;
    }
    .field textarea { resize: vertical; min-height: 60px; }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: var(--brand);
      background: white;
      box-shadow: 0 0 0 3px rgba(62,196,103,0.15);
    }

    /* ─── Items table editor ───────────────────────────────────────────── */
    .items-wrap { overflow-x: auto; margin-bottom: 12px; }
    .items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .items-table th {
      background: #f1f5f9;
      padding: 8px 10px;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .items-table td { padding: 4px 6px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .items-table input {
      width: 100%;
      padding: 7px 8px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      background: white;
      outline: none;
    }
    .items-table input:focus { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(62,196,103,0.15); }
    .items-table input.num { text-align: right; }
    .items-table .row-del {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 16px;
      padding: 4px 6px;
      border-radius: 4px;
      transition: color 0.2s;
    }
    .items-table .row-del:hover { color: var(--red); background: #fff0f0; }

    .btn-add-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1.5px dashed var(--brand);
      border-radius: 8px;
      background: rgba(62,196,103,0.05);
      color: var(--brand-dark);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      justify-content: center;
    }
    .btn-add-row:hover { background: rgba(62,196,103,0.12); }

    /* ─── Transport & Tax fields ───────────────────────────────────────── */
    .totals-editor { font-size: 13px; }
    .totals-editor .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .totals-editor .row:last-child { border: none; }
    .totals-editor .row label { color: var(--text-muted); font-size: 12px; }
    .totals-editor .row .val { font-weight: 600; color: var(--text); min-width: 80px; text-align: right; }
    .totals-editor .row input {
      width: 100px;
      padding: 5px 8px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      text-align: right;
      outline: none;
    }
    .totals-editor .row input:focus { border-color: var(--brand); }
    .totals-editor .grand-total .val { color: var(--sky-dark); font-size: 16px; font-weight: 800; }

    /* ═════════════════════════════════════════════════════════════════════
       INVOICE PREVIEW (right panel)
    ═════════════════════════════════════════════════════════════════════ */
    .invoice-wrap {
      position: sticky;
      top: 84px;
      max-height: calc(100vh - 104px);
      overflow-y: auto;
      scrollbar-width: thin;
    }

    /* The actual printable invoice */
    #invoiceDoc {
      background: white;
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* Amount due header */
    .inv-amount-header {
      background: var(--sky);
      padding: 18px 20px;
      text-align: center;
      color: white;
    }
    .inv-amount-label { font-size: 12px; letter-spacing: 1px; opacity: 0.9; margin-bottom: 4px; }
    .inv-amount-val   { font-size: 32px; font-weight: 800; letter-spacing: -1px; }

    /* Seller info row */
    .inv-seller-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 16px 20px;
      border-bottom: 2px solid var(--border);
      gap: 12px;
    }
    .inv-seller-info .inv-company-name {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .inv-seller-info .inv-addr, .inv-seller-info .inv-phone, .inv-seller-info .inv-mail, .inv-seller-info .inv-web {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.7;
    }
    .inv-seller-info .inv-phone a, .inv-seller-info .inv-mail a, .inv-seller-info .inv-web a { color: var(--sky-dark); text-decoration: none; }
    .inv-logo-box {
      flex-shrink: 0;
      width: 90px;
      text-align: center;
    }
    .inv-logo-leaf {
      width: 50px; height: 50px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      margin: 0 auto 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .inv-logo-label { font-size: 10px; font-weight: 700; color: var(--brand-dark); letter-spacing: 1px; text-transform: uppercase; }

    /* Bill To + Ref row */
    .inv-bill-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1.5px solid var(--border);
      gap: 16px;
    }
    .inv-bill-col { flex: 1; }
    .inv-ref-col  { flex-shrink: 0; text-align: right; }
    .inv-row-label { font-size: 10px; font-weight: 700; color: var(--sky-dark); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .inv-row-value { font-size: 12px; color: var(--text); line-height: 1.6; }
    .inv-row-value .phone { color: var(--sky-dark); }

    /* Items table */
    .inv-items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      border-bottom: 1.5px solid var(--border);
    }
    .inv-items-table thead tr { background: #f8fafc; }
    .inv-items-table th {
      padding: 9px 10px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      border-bottom: 1.5px solid var(--border);
    }
    .inv-items-table th:not(:first-child), .inv-items-table td:not(:first-child) { text-align: right; }
    .inv-items-table td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; color: var(--text); }
    .inv-items-table .tax-row td { color: var(--text-muted); font-style: italic; }
    .inv-items-table .subtotal-row td { font-weight: 700; background: #f8fafc; }

    /* Totals section */
    .inv-totals { padding: 10px 20px; border-bottom: 1.5px solid var(--border); }
    .inv-total-row {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      padding: 4px 0;
      font-size: 12px;
    }
    .inv-total-row .lbl { color: var(--text-muted); width: 130px; text-align: right; }
    .inv-total-row .amt { width: 80px; text-align: right; color: var(--text); font-weight: 600; }
    .inv-total-row.grand .lbl, .inv-total-row.grand .amt { font-weight: 800; font-size: 13px; color: var(--sky-dark); }

    /* Tax details */
    .inv-tax-section { padding: 10px 20px; }
    .inv-tax-title { font-size: 11px; font-weight: 700; text-align: center; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
    .inv-tax-row {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .inv-tax-row .lbl { width: 130px; text-align: right; }
    .inv-tax-row .amt { width: 80px; text-align: right; }

    /* Print preview action row */
    .preview-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      border-radius: 0 0 12px 12px;
    }
    .btn-print {
      padding: 10px 28px;
      background: linear-gradient(135deg, #2a8c47, var(--brand));
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(62,196,103,0.35);
    }
    .btn-print:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(62,196,103,0.5); }

    /* ─── Print styles ────────────────────────────────────────────────── */
    @media print {
      body { background: white; }
      .topbar, .form-col, .preview-actions { display: none !important; }
      .workspace { display: block; padding: 0; }
      .invoice-wrap { position: static; max-height: none; overflow: visible; }
      #invoiceDoc {
        border-radius: 0;
        box-shadow: none;
        max-width: 100%;
      }
    }

    /* ─── Responsive ──────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
      .invoice-wrap { position: static; max-height: none; }
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-leaf"></div>
      <div>
        <div class="topbar-title">BrickBloom</div>
        <div class="topbar-sub">Invoice Generator</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn-sm btn-outline" onclick="clearForm()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1H2.5zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5zM8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5zm3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0z"/></svg>
        Clear
      </button>
      <button class="btn-sm btn-primary" onclick="window.print()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/><path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2H5zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4V3zm1 5a2 2 0 0 0-2 2v1H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v-1a2 2 0 0 0-2-2H5zm7 2v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1z"/></svg>
        Print Invoice
      </button>
    </div>
  </div>

  <div class="workspace">

    <!-- ── Left: Form editor ─────────────────────────────────────────── -->
    <div class="form-col">

      <!-- Invoice Meta -->
      <div class="panel" style="margin-bottom:16px;">
        <div class="panel-head">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M14.5 3a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h13zm-13-1A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-13z"/><path d="M3 5.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5zM3 8a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9A.5.5 0 0 1 3 8zm0 2.5a.5.5 0 0 1 .5-.5h6a.5.5 0 0 1 0 1h-6a.5.5 0 0 1-.5-.5z"/></svg>
          Invoice Details
        </div>
        <div class="panel-body">
          <div class="field-row">
            <div class="field">
              <label>Ref No</label>
              <input type="text" id="refNo" placeholder="BB/26-27/001" oninput="renderPreview()" />
            </div>
            <div class="field">
              <label>Date of Issue</label>
              <input type="date" id="issueDate" oninput="renderPreview()" />
            </div>
          </div>
        </div>
      </div>

      <!-- Bill To -->
      <div class="panel" style="margin-bottom:16px;">
        <div class="panel-head">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2 1H6a4 4 0 0 0-4 4v.5a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5V13a4 4 0 0 0-4-4z"/></svg>
          Bill To (Customer)
        </div>
        <div class="panel-body">
          <div class="field-row single">
            <div class="field">
              <label>Customer Name</label>
              <input type="text" id="custName" placeholder="Mr. / Mrs. ..." oninput="renderPreview()" />
            </div>
          </div>
          <div class="field-row single">
            <div class="field">
              <label>Address</label>
              <textarea id="custAddr" rows="2" placeholder="Street, City, State, PIN" oninput="renderPreview()"></textarea>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Phone</label>
              <input type="tel" id="custPhone" placeholder="+91 XXXXXXXXXX" oninput="renderPreview()" />
            </div>
            <div class="field">
              <label>State</label>
              <input type="text" id="custState" placeholder="Karnataka" oninput="renderPreview()" />
            </div>
          </div>
        </div>
      </div>

      <!-- Line Items -->
      <div class="panel" style="margin-bottom:16px;">
        <div class="panel-head">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.777.416L8 13.101l-5.223 2.815A.5.5 0 0 1 2 15.5V2zm2-1a1 1 0 0 0-1 1v12.566l4.723-2.482a.5.5 0 0 1 .554 0L13 14.566V2a1 1 0 0 0-1-1H4z"/></svg>
          Line Items
        </div>
        <div class="panel-body">
          <div class="items-wrap">
            <table class="items-table">
              <thead>
                <tr>
                  <th style="width:36px">#</th>
                  <th>Item Name</th>
                  <th style="width:80px">Qty &amp; Unit</th>
                  <th style="width:72px">Price</th>
                  <th style="width:80px">Amount</th>
                  <th style="width:32px"></th>
                </tr>
              </thead>
              <tbody id="itemsBody"></tbody>
            </table>
          </div>
          <button class="btn-add-row" onclick="addRow()">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/></svg>
            Add Item
          </button>
        </div>
      </div>

      <!-- Charges -->
      <div class="panel">
        <div class="panel-head">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1 3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1H1zm7 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/><path d="M0 5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V5zm3 0a2 2 0 0 1-2 2v4a2 2 0 0 1 2 2h10a2 2 0 0 1 2-2V7a2 2 0 0 1-2-2H3z"/></svg>
          Charges &amp; Tax
        </div>
        <div class="panel-body">
          <div class="totals-editor">
            <div class="row"><label>Items Sub-total</label><span class="val" id="st_subtotal">₹ 0.00</span></div>
            <div class="row">
              <label>Transport Charges</label>
              <input type="number" id="transport" min="0" placeholder="0" oninput="renderPreview()" style="width:100px" />
            </div>
            <div class="row">
              <label>Tax</label>
              <select id="taxRate" onchange="renderPreview()" style="width:140px;padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;">
                <option value="0">Exempted @ 0%</option>
                <option value="5">GST 5%</option>
                <option value="12">GST 12%</option>
                <option value="18">GST 18%</option>
              </select>
            </div>
            <div class="row"><label>Tax Amount</label><span class="val" id="st_tax">₹ 0.00</span></div>
            <div class="row grand"><label>Grand Total</label><span class="val" id="st_grand">₹ 0.00</span></div>
          </div>
        </div>
      </div>

    </div><!-- /form-col -->

    <!-- ── Right: Preview ────────────────────────────────────────────── -->
    <div class="invoice-wrap">
      <div id="invoiceDoc">
        <!-- Rendered by JS -->
      </div>
      <div class="preview-actions">
        <button class="btn-print" onclick="window.print()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/><path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2H5zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4V3zm1 5a2 2 0 0 0-2 2v1H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v-1a2 2 0 0 0-2-2H5zm7 2v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1z"/></svg>
          Print / Save as PDF
        </button>
      </div>
    </div>

  </div><!-- /workspace -->

  <script>
    // ─────────────────────────────────────────────────────────────────────
    // Auth guard
    // ─────────────────────────────────────────────────────────────────────
    if (!sessionStorage.getItem('bb_admin')) {
      window.location.replace('/admin');
    }

    // ─────────────────────────────────────────────────────────────────────
    // State
    // ─────────────────────────────────────────────────────────────────────
    let items = [];
    let rowCounter = 0;

    // ─────────────────────────────────────────────────────────────────────
    // Row management
    // ─────────────────────────────────────────────────────────────────────
    function addRow(name = '', qty = '', unit = 'Nos', price = '') {
      const id = ++rowCounter;
      items.push({ id, name, qty, unit, price });
      rebuildTable();
    }

    function removeRow(id) {
      items = items.filter(r => r.id !== id);
      rebuildTable();
    }

    function updateRow(id, field, value) {
      const r = items.find(r => r.id === id);
      if (r) { r[field] = value; renderPreview(); }
    }

    function rebuildTable() {
      const tbody = document.getElementById('itemsBody');
      tbody.innerHTML = '';
      items.forEach((item, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color:var(--text-muted);font-size:11px;text-align:center">${idx + 1}</td>
          <td><input type="text" placeholder="Item name" value="${esc(item.name)}"
            oninput="updateRow(${item.id},'name',this.value)" /></td>
          <td style="display:flex;gap:4px;">
            <input type="number" class="num" placeholder="0" value="${esc(item.qty)}" min="0" style="width:46px"
              oninput="updateRow(${item.id},'qty',this.value)" />
            <input type="text" placeholder="Nos" value="${esc(item.unit)}" style="width:40px"
              oninput="updateRow(${item.id},'unit',this.value)" />
          </td>
          <td><input type="number" class="num" placeholder="0.00" value="${esc(item.price)}" min="0" step="0.01"
            oninput="updateRow(${item.id},'price',this.value)" /></td>
          <td style="text-align:right;font-weight:600;font-size:12px;color:var(--text)">
            ${fmt(parseFloat(item.qty || 0) * parseFloat(item.price || 0))}
          </td>
          <td><button class="row-del" onclick="removeRow(${item.id})" title="Remove">✕</button></td>
        `;
        tbody.appendChild(tr);
      });
      renderPreview();
    }

    // ─────────────────────────────────────────────────────────────────────
    // Calculations
    // ─────────────────────────────────────────────────────────────────────
    function calcTotals() {
      const subtotal   = items.reduce((s, r) => s + parseFloat(r.qty || 0) * parseFloat(r.price || 0), 0);
      const transport  = parseFloat(document.getElementById('transport').value || 0);
      const taxRate    = parseFloat(document.getElementById('taxRate').value || 0);
      const taxAmount  = subtotal * taxRate / 100;
      const grand      = subtotal + transport + taxAmount;
      return { subtotal, transport, taxRate, taxAmount, grand };
    }

    // ─────────────────────────────────────────────────────────────────────
    // Helpers
    // ─────────────────────────────────────────────────────────────────────
    function fmt(n) { return '₹\u00a0' + (isNaN(n) ? '0.00' : n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',')); }
    function fmtPlain(n) { return (isNaN(n) ? '0.00' : n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',')); }
    function esc(v) { return String(v || '').replace(/"/g, '&quot;'); }
    function escHtml(v) {
      return String(v || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function formatDate(d) {
      if (!d) return '';
      const [y, m, dd] = d.split('-');
      return `${dd}-${m}-${y}`;
    }

    // ─────────────────────────────────────────────────────────────────────
    // Render preview
    // ─────────────────────────────────────────────────────────────────────
    function renderPreview() {
      const { subtotal, transport, taxRate, taxAmount, grand } = calcTotals();

      // Update left-panel totals
      document.getElementById('st_subtotal').textContent = fmt(subtotal);
      document.getElementById('st_tax').textContent      = fmt(taxAmount);
      document.getElementById('st_grand').textContent    = fmt(grand);

      // Build item rows
      const totalQty = items.reduce((s, r) => s + parseFloat(r.qty || 0), 0);
      const itemRows = items.map((r, idx) => {
        const amt = parseFloat(r.qty || 0) * parseFloat(r.price || 0);
        return `
          <tr>
            <td>${idx + 1}</td>
            <td>${escHtml(r.name || '—')}</td>
            <td style="text-align:right">${escHtml(r.qty)}${r.unit ? ' ' + escHtml(r.unit) : ''}</td>
            <td style="text-align:right">${fmtPlain(parseFloat(r.price || 0))}</td>
            <td style="text-align:right">${fmtPlain(amt)}</td>
          </tr>
          <tr class="tax-row">
            <td colspan="3" style="text-align:right;padding-right:12px">Tax: ${taxRate === 0 ? 'Exempted :' : taxRate + '% :'}</td>
            <td colspan="2" style="text-align:right">${fmtPlain(taxRate === 0 ? 0 : amt * taxRate / 100)}</td>
          </tr>
        `;
      }).join('');

      const refNo     = escHtml(document.getElementById('refNo').value || 'BB/26-27/—');
      const issueDate = escHtml(formatDate(document.getElementById('issueDate').value));
      const custName  = escHtml(document.getElementById('custName').value);
      const custAddr  = escHtml(document.getElementById('custAddr').value).replace(/\n/g, '<br>');
      const custPhone = escHtml(document.getElementById('custPhone').value);
      const custState = escHtml(document.getElementById('custState').value);

      document.getElementById('invoiceDoc').innerHTML = `
        <!-- Amount Due Header -->
        <div class="inv-amount-header">
          <div class="inv-amount-label">Amount due</div>
          <div class="inv-amount-val">₹ ${grand.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</div>
        </div>

        <!-- Seller Info -->
        <div class="inv-seller-row">
          <div class="inv-seller-info">
            <div class="inv-company-name">BrickBloom</div>
            <div class="inv-addr">No 12, Ground Floor, AVP Complex,<br>Sy No 97, Dommasandra Village,<br>Virgo Nagar Post, Bangalore 560049</div>
            <div class="inv-phone"><a href="tel:+918951744898">📞 +91 8951744898</a></div>
            <div class="inv-mail"><a href="mailto:info@brickbloom.co.in">✉ info@brickbloom.co.in</a></div>
            <div class="inv-web"><a href="https://www.brickbloom.co.in">🌐 www.brickbloom.co.in</a></div>
          </div>
          <div class="inv-logo-box">
            <div class="inv-logo-leaf"></div>
            <div class="inv-logo-label">BrickBloom</div>
          </div>
        </div>

        <!-- Bill To + Ref No -->
        <div class="inv-bill-row">
          <div class="inv-bill-col">
            <div class="inv-row-label">Bill To:</div>
            <div class="inv-row-value">
              <strong>${custName || 'Customer Name'}</strong><br>
              ${custAddr || '—'}<br>
              ${custPhone ? `<span class="phone">${custPhone}</span><br>` : ''}
              ${custState || ''}
            </div>
          </div>
          <div class="inv-ref-col">
            <div class="inv-row-label" style="color:var(--text-muted)">Ref No:</div>
            <div class="inv-row-value" style="color:var(--sky-dark);font-weight:700">${refNo}</div>
            <div style="margin-top:8px">
              <div class="inv-row-label" style="color:var(--sky-dark)">Date of Issue</div>
              <div class="inv-row-value">${issueDate || '—'}</div>
            </div>
          </div>
        </div>

        <!-- Items Table -->
        <table class="inv-items-table">
          <thead>
            <tr>
              <th style="width:30px">SR</th>
              <th>Name</th>
              <th>Qty</th>
              <th>Price</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody>
            ${itemRows || '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:16px">No items added</td></tr>'}
            <tr class="subtotal-row">
              <td colspan="2"><strong>Total</strong></td>
              <td style="text-align:right">${totalQty}</td>
              <td></td>
              <td style="text-align:right">${fmtPlain(subtotal)}</td>
            </tr>
          </tbody>
        </table>

        <!-- Totals -->
        <div class="inv-totals">
          <div class="inv-total-row">
            <span class="lbl">Transport charges</span>
            <span class="amt">${fmtPlain(transport)}</span>
          </div>
          <div class="inv-total-row grand">
            <span class="lbl">Total</span>
            <span class="amt">${fmtPlain(grand)}</span>
          </div>
          <div class="inv-total-row">
            <span class="lbl">Balance</span>
            <span class="amt">${fmtPlain(grand)}</span>
          </div>
        </div>

        <!-- Tax Details -->
        <div class="inv-tax-section">
          <div class="inv-tax-title">Tax Details</div>
          <div class="inv-tax-row">
            <span class="lbl">EXEMPTED @ ${taxRate}%</span>
            <span class="amt">${fmtPlain(taxAmount)}</span>
          </div>
        </div>
      `;
    }

    // ─────────────────────────────────────────────────────────────────────
    // Clear form
    // ─────────────────────────────────────────────────────────────────────
    function clearForm() {
      if (!confirm('Clear all invoice data?')) return;
      ['refNo','custName','custAddr','custPhone','custState','transport'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.getElementById('issueDate').value = today();
      document.getElementById('taxRate').value = '0';
      items = []; rowCounter = 0;
      rebuildTable();
    }

    // ─────────────────────────────────────────────────────────────────────
    // Init
    // ─────────────────────────────────────────────────────────────────────
    function today() {
      return new Date().toISOString().split('T')[0];
    }

    document.getElementById('issueDate').value = today();
    addRow('', '', 'Nos', '');   // start with one empty row
    renderPreview();
  </script>
</body>
</html>
