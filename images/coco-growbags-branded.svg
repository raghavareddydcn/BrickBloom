<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#2D2D2D"/>
    </linearGradient>
    <linearGradient id="bagBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="bagSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0EAE0"/>
    </linearGradient>
    <linearGradient id="labelHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B1A1A"/>
      <stop offset="50%" stop-color="#5C1010"/>
      <stop offset="100%" stop-color="#1E6B1E"/>
    </linearGradient>
    <linearGradient id="coirFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5E2A"/>
      <stop offset="100%" stop-color="#5C3A10"/>
    </linearGradient>
    <filter id="bagShadow">
      <feDropShadow dx="6" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="bagGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background - clean light grey/white studio -->
  <rect width="900" height="900" fill="#F0EDE8"/>
  <ellipse cx="450" cy="830" rx="350" ry="45" fill="#C0B0A0" opacity="0.2"/>

  <!-- ====================== BAG 1 (back-left) ====================== -->
  <g transform="translate(60, 150)" filter="url(#bagShadow)" opacity="0.85">
    <!-- Bag body -->
    <rect x="0" y="100" width="200" height="500" rx="15" fill="url(#bagBody)"/>
    <!-- Bag fold top -->
    <path d="M 0,100 Q 100,80 200,100 L 200,140 Q 100,120 0,140 Z" fill="#0D0D0D"/>
    <!-- Sheen -->
    <rect x="0" y="100" width="200" height="500" rx="15" fill="url(#bagSheen)"/>
    <!-- Coir substrate top -->
    <ellipse cx="100" cy="100" rx="90" ry="30" fill="url(#coirFill)"/>
    <!-- Label -->
    <rect x="20" y="220" width="160" height="180" rx="5" fill="url(#labelGrad)" stroke="#C8A880" stroke-width="1.5"/>
    <rect x="20" y="220" width="160" height="32" rx="5" fill="url(#labelHeaderGrad)"/>
    <rect x="20" y="246" width="160" height="6" fill="url(#labelHeaderGrad)"/>
    <text x="100" y="241" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="11" fill="white" letter-spacing="0.5">BRICKBLOOM</text>
    <text x="100" y="278" text-anchor="middle" font-family="Georgia, serif" font-weight="800" font-size="11" fill="#1A0A00">COCO GROW</text>
    <text x="100" y="294" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="10" fill="#1A0A00">GROWBAG</text>
    <text x="100" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#7B4A1E">ORGANIC COCO PEAT</text>
    <text x="100" y="329" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#7B4A1E">MOISTURE RETAINING</text>
    <text x="100" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#5C3210">10L · ECO-FRIENDLY</text>
    <!-- Palm icon -->
    <text x="100" y="385" text-anchor="middle" font-size="22">🌱</text>
  </g>

  <!-- ====================== BAG 2 (back-center) ====================== -->
  <g transform="translate(240, 120)" filter="url(#bagShadow)" opacity="0.9">
    <rect x="0" y="100" width="200" height="510" rx="15" fill="url(#bagBody)"/>
    <path d="M 0,100 Q 100,78 200,100 L 200,142 Q 100,120 0,142 Z" fill="#0D0D0D"/>
    <rect x="0" y="100" width="200" height="510" rx="15" fill="url(#bagSheen)"/>
    <ellipse cx="100" cy="100" rx="90" ry="30" fill="url(#coirFill)"/>
    <rect x="20" y="220" width="160" height="180" rx="5" fill="url(#labelGrad)" stroke="#C8A880" stroke-width="1.5"/>
    <rect x="20" y="220" width="160" height="32" rx="5" fill="url(#labelHeaderGrad)"/>
    <rect x="20" y="246" width="160" height="6" fill="url(#labelHeaderGrad)"/>
    <text x="100" y="241" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="11" fill="white" letter-spacing="0.5">BRICKBLOOM</text>
    <text x="100" y="278" text-anchor="middle" font-family="Georgia, serif" font-weight="800" font-size="11" fill="#1A0A00">COCO GROW</text>
    <text x="100" y="294" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="10" fill="#1A0A00">GROWBAG</text>
    <text x="100" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#7B4A1E">ORGANIC COCO PEAT</text>
    <text x="100" y="329" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#7B4A1E">MOISTURE RETAINING</text>
    <text x="100" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#5C3210">10L · ECO-FRIENDLY</text>
    <text x="100" y="385" text-anchor="middle" font-size="22">🌱</text>
  </g>

  <!-- ====================== BAG 3 (center-front, largest) ====================== -->
  <g transform="translate(320, 90)" filter="url(#bagShadow)">
    <rect x="0" y="100" width="230" height="560" rx="15" fill="url(#bagBody)"/>
    <path d="M 0,100 Q 115,75 230,100 L 230,148 Q 115,123 0,148 Z" fill="#0D0D0D"/>
    <rect x="0" y="100" width="230" height="560" rx="15" fill="url(#bagSheen)"/>
    <!-- Coir top with texture -->
    <ellipse cx="115" cy="100" rx="105" ry="35" fill="#8B5E2A"/>
    <ellipse cx="115" cy="100" rx="85" ry="25" fill="#7B4A1E"/>
    <!-- Cocopeat loose bits -->
    <circle cx="80" cy="95" r="5" fill="#6B4010" opacity="0.7"/>
    <circle cx="100" cy="90" r="4" fill="#8B6030" opacity="0.6"/>
    <circle cx="120" cy="93" r="6" fill="#5C3210" opacity="0.8"/>
    <circle cx="145" cy="95" r="4" fill="#7B4A1E" opacity="0.7"/>
    
    <!-- Big label -->
    <rect x="22" y="210" width="186" height="230" rx="6" fill="url(#labelGrad)" stroke="#C8A880" stroke-width="2"/>
    <rect x="22" y="210" width="186" height="38" rx="6" fill="url(#labelHeaderGrad)"/>
    <rect x="22" y="242" width="186" height="6" fill="url(#labelHeaderGrad)"/>
    <text x="115" y="235" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="14" fill="white" letter-spacing="1">BRICKBLOOM</text>
    <text x="115" y="275" text-anchor="middle" font-family="Georgia, serif" font-weight="900" font-size="16" fill="#2E1A08">COCO GROW</text>
    <text x="115" y="297" text-anchor="middle" font-family="Georgia, serif" font-weight="900" font-size="16" fill="#2E1A08">GROWBAG</text>
    <line x1="40" y1="308" x2="190" y2="308" stroke="#C8A880" stroke-width="1"/>
    <text x="115" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#7B4A1E">ORGANIC COCONUT PEAT</text>
    <text x="115" y="342" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#7B4A1E">MOISTURE RETAINING · ECO-FRIENDLY</text>
    <text x="115" y="360" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="11" fill="#5C3210">MEDIUM SIZE / 10L</text>
    <!-- Seedling icon area -->
    <circle cx="115" cy="405" r="25" fill="#1E6B1E" opacity="0.1"/>
    <text x="115" y="418" text-anchor="middle" font-size="32">🌱</text>
    
    <!-- Planting indicator hole on top -->
    <circle cx="115" cy="95" r="8" fill="#3E1F06" opacity="0.4"/>
  </g>

  <!-- ====================== BAG 4 (back-right) ====================== -->
  <g transform="translate(560, 130)" filter="url(#bagShadow)" opacity="0.9">
    <rect x="0" y="100" width="200" height="510" rx="15" fill="url(#bagBody)"/>
    <path d="M 0,100 Q 100,78 200,100 L 200,142 Q 100,120 0,142 Z" fill="#0D0D0D"/>
    <rect x="0" y="100" width="200" height="510" rx="15" fill="url(#bagSheen)"/>
    <ellipse cx="100" cy="100" rx="90" ry="30" fill="url(#coirFill)"/>
    <rect x="20" y="220" width="160" height="180" rx="5" fill="url(#labelGrad)" stroke="#C8A880" stroke-width="1.5"/>
    <rect x="20" y="220" width="160" height="32" rx="5" fill="url(#labelHeaderGrad)"/>
    <rect x="20" y="246" width="160" height="6" fill="url(#labelHeaderGrad)"/>
    <text x="100" y="241" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="11" fill="white" letter-spacing="0.5">BRICKBLOOM</text>
    <text x="100" y="278" text-anchor="middle" font-family="Georgia, serif" font-weight="800" font-size="11" fill="#1A0A00">COCO GROW</text>
    <text x="100" y="294" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="10" fill="#1A0A00">GROWBAG</text>
    <text x="100" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#7B4A1E">ORGANIC COCO PEAT</text>
    <text x="100" y="329" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#7B4A1E">MOISTURE RETAINING</text>
    <text x="100" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#5C3210">10L · ECO-FRIENDLY</text>
    <text x="100" y="385" text-anchor="middle" font-size="22">🌱</text>
  </g>

  <!-- ====================== BAG 5 (back far-right) ====================== -->
  <g transform="translate(690, 160)" filter="url(#bagShadow)" opacity="0.8">
    <rect x="0" y="100" width="190" height="490" rx="15" fill="url(#bagBody)"/>
    <path d="M 0,100 Q 95,78 190,100 L 190,140 Q 95,120 0,140 Z" fill="#0D0D0D"/>
    <rect x="0" y="100" width="190" height="490" rx="15" fill="url(#bagSheen)"/>
    <ellipse cx="95" cy="100" rx="85" ry="28" fill="url(#coirFill)"/>
    <rect x="18" y="215" width="154" height="170" rx="5" fill="url(#labelGrad)" stroke="#C8A880" stroke-width="1.5"/>
    <rect x="18" y="215" width="154" height="30" rx="5" fill="url(#labelHeaderGrad)"/>
    <rect x="18" y="239" width="154" height="6" fill="url(#labelHeaderGrad)"/>
    <text x="95" y="234" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="10" fill="white" letter-spacing="0.5">BRICKBLOOM</text>
    <text x="95" y="269" text-anchor="middle" font-family="Georgia, serif" font-weight="800" font-size="10" fill="#1A0A00">COCO GROW</text>
    <text x="95" y="283" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="9" fill="#1A0A00">GROWBAG</text>
    <text x="95" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#7B4A1E">ORGANIC COCO PEAT</text>
    <text x="95" y="313" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#5C3210">10L · ECO-FRIENDLY</text>
    <text x="95" y="360" text-anchor="middle" font-size="20">🌱</text>
  </g>

  <!-- BrickBloom brand badge -->
  <g transform="translate(28, 28)">
    <rect x="0" y="0" width="198" height="66" rx="14" fill="#1A0A00" opacity="0.92"/>
    <text x="99" y="21" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#C8A87A" letter-spacing="1">KONASEMA COCO PRODUCTS</text>
    <text x="99" y="43" text-anchor="middle" font-family="Georgia, serif" font-weight="900" font-size="20" fill="white">BrickBloom</text>
    <text x="99" y="59" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#C8A87A">From Nature. For Nature.</text>
  </g>
</svg>
