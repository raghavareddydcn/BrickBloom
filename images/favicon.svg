<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shellG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B4A1E"/>
      <stop offset="100%" stop-color="#3E1F06"/>
    </linearGradient>
    <linearGradient id="coirG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5E2A"/>
      <stop offset="100%" stop-color="#4E2D0A"/>
    </linearGradient>
    <linearGradient id="leafG" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="#F5F0EB"/>
  <!-- Half coconut shell -->
  <path d="M 10,38 Q 10,56 32,56 Q 54,56 54,38 Z" fill="url(#shellG)"/>
  <!-- Cocopeat fill inside -->
  <ellipse cx="32" cy="38" rx="22" ry="8" fill="url(#coirG)"/>
  <!-- Plant stem -->
  <line x1="32" y1="36" x2="32" y2="16" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left leaf -->
  <path d="M 32,26 Q 18,20 14,10 Q 24,18 32,26 Z" fill="url(#leafG)"/>
  <!-- Right leaf -->
  <path d="M 32,22 Q 46,16 50,8 Q 40,14 32,22 Z" fill="url(#leafG)"/>
  <!-- Top sprout tip -->
  <path d="M 32,16 Q 28,10 30,6 Q 34,10 32,16 Z" fill="#4CAF50"/>
  <path d="M 32,16 Q 36,10 34,6 Q 30,10 32,16 Z" fill="#388E3C"/>
</svg>