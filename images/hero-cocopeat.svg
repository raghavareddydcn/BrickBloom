<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F0EB"/>
      <stop offset="100%" stop-color="#E8DDD0"/>
    </linearGradient>
    <linearGradient id="brickBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B4A1E"/>
      <stop offset="50%" stop-color="#5C3210"/>
      <stop offset="100%" stop-color="#3E1F06"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEFCF9"/>
      <stop offset="100%" stop-color="#F2EDE6"/>
    </linearGradient>
    <linearGradient id="labelTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C3210"/>
      <stop offset="100%" stop-color="#3E1F06"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8B8A2"/>
      <stop offset="100%" stop-color="#A89070"/>
    </linearGradient>
    <filter id="brickShadow">
      <feDropShadow dx="5" dy="10" stdDeviation="8" flood-color="#1a0800" flood-opacity="0.4"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Coir texture pattern -->
    <pattern id="coirPattern" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#5C3210"/>
      <line x1="0" y1="3" x2="8" y2="3" stroke="#7B4A1E" stroke-width="0.8" opacity="0.6"/>
      <line x1="0" y1="7" x2="8" y2="7" stroke="#4A2808" stroke-width="0.8" opacity="0.4"/>
      <line x1="3" y1="0" x2="3" y2="8" stroke="#6B4010" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad)"/>
  
  <!-- Wooden floor suggestion -->
  <rect x="0" y="420" width="900" height="180" fill="url(#floorGrad)" opacity="0.5"/>
  <line x1="0" y1="421" x2="900" y2="421" stroke="#A89070" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Cocopeat loose pile (scattered at base) -->
  <ellipse cx="450" cy="450" rx="300" ry="30" fill="#5C3210" opacity="0.15"/>
  <ellipse cx="450" cy="450" rx="200" ry="20" fill="#5C3210" opacity="0.1"/>

  <!-- === COCO PEAT BRICKS STACK (back row) === -->
  <!-- Brick back-left -->
  <g transform="translate(100, 220)" filter="url(#brickShadow)">
    <!-- Brick body -->
    <rect x="0" y="40" width="170" height="110" rx="6" fill="url(#coirPattern)"/>
    <rect x="0" y="40" width="170" height="110" rx="6" fill="url(#brickBodyGrad)" opacity="0.7"/>
    <!-- Top face -->
    <path d="M 0,40 L 30,20 L 200,20 L 170,40 Z" fill="#7B4A1E"/>
    <!-- Right face -->
    <path d="M 170,40 L 200,20 L 200,130 L 170,150 Z" fill="#3E1F06"/>
    <!-- BrickBloom Label on brick -->
    <rect x="20" y="65" width="130" height="60" rx="4" fill="url(#labelGrad)" stroke="#D4B896" stroke-width="1"/>
    <!-- Label header bar -->
    <rect x="20" y="65" width="130" height="20" rx="4" fill="url(#labelTopGrad)"/>
    <text x="85" y="79" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="9" fill="white" letter-spacing="0.5">BRICKBLOOM</text>
    <!-- Label body text -->
    <text x="85" y="97" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="9" fill="#3E1F06">PREMIUM COCO</text>
    <text x="85" y="109" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="9" fill="#3E1F06">PEAT BRICK</text>
    <text x="85" y="119" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#7B4A1E">5 KG · TRIPLE WASHED</text>
    <!-- Strap lines -->
    <rect x="-5" y="75" width="180" height="3" fill="#D0BCA0" opacity="0.8"/>
    <rect x="-5" y="120" width="180" height="3" fill="#D0BCA0" opacity="0.8"/>
  </g>

  <!-- Brick back-center -->
  <g transform="translate(340, 200)" filter="url(#brickShadow)">
    <rect x="0" y="40" width="170" height="110" rx="6" fill="url(#coirPattern)"/>
    <rect x="0" y="40" width="170" height="110" rx="6" fill="url(#brickBodyGrad)" opacity="0.7"/>
    <path d="M 0,40 L 30,20 L 200,20 L 170,40 Z" fill="#7B4A1E"/>
    <path d="M 170,40 L 200,20 L 200,130 L 170,150 Z" fill="#3E1F06"/>
    <rect x="20" y="65" width="130" height="60" rx="4" fill="url(#labelGrad)" stroke="#D4B896" stroke-width="1"/>
    <rect x="20" y="65" width="130" height="20" rx="4" fill="url(#labelTopGrad)"/>
    <text x="85" y="79" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="9" fill="white" letter-spacing="0.5">BRICKBLOOM</text>
    <text x="85" y="97" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="9" fill="#3E1F06">PREMIUM COCO</text>
    <text x="85" y="109" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="9" fill="#3E1F06">PEAT BRICK</text>
    <text x="85" y="119" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#7B4A1E">5 KG · TRIPLE WASHED</text>
    <rect x="-5" y="75" width="180" height="3" fill="#D0BCA0" opacity="0.8"/>
    <rect x="-5" y="120" width="180" height="3" fill="#D0BCA0" opacity="0.8"/>
  </g>

  <!-- Brick back-right -->
  <g transform="translate(580, 220)" filter="url(#brickShadow)">
    <rect x="0" y="40" width="170" height="110" rx="6" fill="url(#coirPattern)"/>
    <rect x="0" y="40" width="170" height="110" rx="6" fill="url(#brickBodyGrad)" opacity="0.7"/>
    <path d="M 0,40 L 30,20 L 200,20 L 170,40 Z" fill="#7B4A1E"/>
    <path d="M 170,40 L 200,20 L 200,130 L 170,150 Z" fill="#3E1F06"/>
    <rect x="20" y="65" width="130" height="60" rx="4" fill="url(#labelGrad)" stroke="#D4B896" stroke-width="1"/>
    <rect x="20" y="65" width="130" height="20" rx="4" fill="url(#labelTopGrad)"/>
    <text x="85" y="79" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="9" fill="white" letter-spacing="0.5">BRICKBLOOM</text>
    <text x="85" y="97" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="9" fill="#3E1F06">PREMIUM COCO</text>
    <text x="85" y="109" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="9" fill="#3E1F06">PEAT BRICK</text>
    <text x="85" y="119" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#7B4A1E">5 KG · TRIPLE WASHED</text>
    <rect x="-5" y="75" width="180" height="3" fill="#D0BCA0" opacity="0.8"/>
    <rect x="-5" y="120" width="180" height="3" fill="#D0BCA0" opacity="0.8"/>
  </g>

  <!-- === FRONT ROW BRICKS (larger, foreground) === -->
  <!-- Front-left brick -->
  <g transform="translate(60, 320)" filter="url(#brickShadow)">
    <rect x="0" y="40" width="200" height="130" rx="7" fill="url(#coirPattern)"/>
    <rect x="0" y="40" width="200" height="130" rx="7" fill="url(#brickBodyGrad)" opacity="0.75"/>
    <path d="M 0,40 L 35,15 L 235,15 L 200,40 Z" fill="#8B5A24"/>
    <path d="M 200,40 L 235,15 L 235,145 L 200,170 Z" fill="#3E1F06"/>
    <!-- Large label on front brick -->
    <rect x="20" y="75" width="160" height="70" rx="5" fill="url(#labelGrad)" stroke="#C8A87A" stroke-width="1.5"/>
    <rect x="20" y="75" width="160" height="24" rx="5" fill="url(#labelTopGrad)"/>
    <rect x="20" y="93" width="160" height="6" fill="url(#labelTopGrad)"/>
    <text x="100" y="91" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="11" fill="white" letter-spacing="1">BRICKBLOOM</text>
    <text x="100" y="112" text-anchor="middle" font-family="Georgia, serif" font-weight="800" font-size="12" fill="#2E1A08">COCO PEAT</text>
    <text x="100" y="127" text-anchor="middle" font-family="Georgia, serif" font-weight="800" font-size="12" fill="#2E1A08">BRICK</text>
    <text x="100" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#7B4A1E">PREMIUM BUFFERED · LOW EC ≤ 0.5</text>
    <rect x="-5" y="95" width="215" height="4" fill="#D0BCA0" opacity="0.9"/>
    <rect x="-5" y="145" width="215" height="4" fill="#D0BCA0" opacity="0.9"/>
  </g>

  <!-- Front-right brick (slightly offset) -->
  <g transform="translate(570, 310)" filter="url(#brickShadow)">
    <rect x="0" y="40" width="200" height="130" rx="7" fill="url(#coirPattern)"/>
    <rect x="0" y="40" width="200" height="130" rx="7" fill="url(#brickBodyGrad)" opacity="0.75"/>
    <path d="M 0,40 L 35,15 L 235,15 L 200,40 Z" fill="#8B5A24"/>
    <path d="M 200,40 L 235,15 L 235,145 L 200,170 Z" fill="#3E1F06"/>
    <rect x="20" y="75" width="160" height="70" rx="5" fill="url(#labelGrad)" stroke="#C8A87A" stroke-width="1.5"/>
    <rect x="20" y="75" width="160" height="24" rx="5" fill="url(#labelTopGrad)"/>
    <rect x="20" y="93" width="160" height="6" fill="url(#labelTopGrad)"/>
    <text x="100" y="91" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="11" fill="white" letter-spacing="1">BRICKBLOOM</text>
    <text x="100" y="112" text-anchor="middle" font-family="Georgia, serif" font-weight="800" font-size="12" fill="#2E1A08">COCO PEAT</text>
    <text x="100" y="127" text-anchor="middle" font-family="Georgia, serif" font-weight="800" font-size="12" fill="#2E1A08">BRICK</text>
    <text x="100" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#7B4A1E">PREMIUM BUFFERED · LOW EC ≤ 0.5</text>
    <rect x="-5" y="95" width="215" height="4" fill="#D0BCA0" opacity="0.9"/>
    <rect x="-5" y="145" width="215" height="4" fill="#D0BCA0" opacity="0.9"/>
  </g>

  <!-- BrickBloom brand badge overlay (top-right) -->
  <g transform="translate(700, 30)">
    <rect x="0" y="0" width="175" height="60" rx="12" fill="#3E1F06" opacity="0.9"/>
    <text x="87" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#C8A87A" letter-spacing="1">KONASEMA COCO PRODUCTS</text>
    <text x="87" y="40" text-anchor="middle" font-family="Georgia, serif" font-weight="900" font-size="18" fill="white">BrickBloom</text>
    <text x="87" y="54" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="9" fill="#C8A87A">From Nature. For Nature.</text>
  </g>

  <!-- Floating quality spec badges -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="115" height="34" rx="17" fill="white" opacity="0.9" stroke="#C8A87A" stroke-width="1"/>
    <text x="57" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#7B4A1E">LOW EC ≤ 0.5 mS/cm</text>
    <text x="57" y="27" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="9" fill="#3E1F06">Export Certified</text>
  </g>
  <g transform="translate(20, 62)">
    <rect x="0" y="0" width="115" height="34" rx="17" fill="white" opacity="0.9" stroke="#4CAF50" stroke-width="1"/>
    <text x="57" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#2E7D32">100% Organic</text>
    <text x="57" y="27" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="9" fill="#1B5E20">Triple Washed</text>
  </g>
</svg>
